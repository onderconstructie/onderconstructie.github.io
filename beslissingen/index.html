<style>
:root {
  --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1; --slate-200:#e2e8f0;
  --slate-100:#f1f5f9; --slate-50:#f8fafc; --wit:#ffffff;
  --accent:#10b981; --accent-dark:#047857; --accent-hover:#065f46; --accent-light:#d1fae5; --accent-50:#ecfdf5;
  --rood:#ef4444; --oranje:#d97706; --oranje-50:#fffbeb;
  --bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'DM Sans', system-ui, sans-serif; background:var(--slate-50); color:var(--slate-700);
  line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
button, input, textarea, select { font:inherit; color:inherit; }
button { background:none; border:0; cursor:pointer; }
[hidden] { display:none !important; }

/* Kop */
.header { background:var(--wit); border-bottom:1px solid var(--slate-200); padding:1.5rem 1.25rem 1.75rem; position:relative; text-align:center; }
.back-link {
  position:absolute; top:1.25rem; left:1.25rem; display:inline-flex; align-items:center; gap:0.5rem;
  font-size:0.875rem; color:var(--slate-500); text-decoration:none; transition:color 0.2s;
}
.back-link:hover { color:var(--accent-dark); }
.back-link svg { width:16px; height:16px; }
.logo svg { width:56px; height:56px; }
.title { font-size:1.625rem; font-weight:700; color:var(--slate-800); letter-spacing:-0.03em; line-height:1.2; margin-top:0.5rem; }
.subtitle { font-size:0.9375rem; color:var(--slate-500); }

.main { flex:1; width:100%; max-width:720px; margin:0 auto; padding:1.25rem 1rem 3rem; }

/* Logs */
.lists { display:flex; gap:0.5rem; overflow-x:auto; scrollbar-width:none; margin:0 -1rem 1rem; padding:0.125rem 1rem; }
.lists::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; padding:0.4375rem 0.875rem; border-radius:999px; font-size:0.875rem; font-weight:600;
  border:1px solid var(--slate-200); background:var(--wit); color:var(--slate-600); white-space:nowrap;
  display:flex; align-items:center; gap:0.375rem;
}
.tab .n { font-size:0.75rem; font-weight:500; color:var(--slate-500); font-variant-numeric:tabular-nums; }
.tab.active { background:var(--slate-800); border-color:var(--slate-800); color:var(--wit); }
.tab.active .n { color:var(--slate-300); }
.tab.add { color:var(--accent-dark); border-style:dashed; }

/* Kaart */
.card { background:var(--wit); border:1px solid var(--slate-200); border-radius:16px; box-shadow:0 1px 2px rgba(15,23,42,0.04); }
.card-head { display:flex; align-items:center; gap:0.5rem; padding:1rem 0.75rem 0.25rem 1.125rem; }
.list-name {
  flex:1; min-width:0; font-size:1.25rem; font-weight:700; color:var(--slate-800); letter-spacing:-0.02em;
  border:0; background:none; outline:none; padding:0.125rem 0; border-bottom:1.5px solid transparent;
}
.list-name:focus, .list-name:focus-visible { border-bottom-color:var(--accent);  }
.count-line { padding:0 1.125rem 0.875rem; font-size:0.8125rem; color:var(--slate-500); font-variant-numeric:tabular-nums; }
.icon-btn { width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--slate-500); flex-shrink:0; }
.icon-btn:hover { background:var(--slate-100); color:var(--slate-700); }
.icon-btn svg { width:20px; height:20px; }
.icon-btn.icon-del:hover { background:#fef2f2; color:#b91c1c; }

/* Invoer */
.add { padding:0 0.75rem 0.875rem; }
.add-row { display:flex; gap:0.5rem; }
.field, .add-input {
  width:100%; min-width:0; padding:0.6875rem 0.875rem; border:1.5px solid var(--slate-200); border-radius:10px;
  background:var(--slate-50); outline:none; font-size:1rem; transition:border-color 0.15s, background 0.15s;
}
.add-input { flex:1; }
.field:focus, .add-input:focus { border-color:var(--accent); background:var(--wit); }
.field::placeholder, .add-input::placeholder { color:var(--slate-400); }
textarea.field { resize:vertical; min-height:4.25rem; line-height:1.45; }
.add-btn { width:46px; border-radius:10px; background:var(--accent-dark); color:var(--wit); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.add-btn:hover { background:var(--accent-hover); }
.add-btn svg { width:22px; height:22px; }
.more-toggle {
  margin-top:0.5rem; display:inline-flex; align-items:center; gap:0.375rem; font-size:0.875rem; font-weight:500;
  color:var(--accent-dark); padding:0.25rem 0.375rem; margin-left:-0.375rem; border-radius:6px;
}
.more-toggle svg { width:16px; height:16px; transition:transform 0.2s; }
.more-toggle[aria-expanded="true"] svg { transform:rotate(180deg); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:0.625rem; }
.grid .full { grid-column:1 / -1; }
.lbl { display:block; font-size:0.75rem; font-weight:600; color:var(--slate-500); margin-bottom:0.3125rem; letter-spacing:0.01em; }
.replacing {
  display:flex; align-items:center; gap:0.5rem; margin-bottom:0.625rem; padding:0.5rem 0.75rem; border-radius:10px;
  background:var(--oranje-50); color:#92400e; font-size:0.8125rem;
}
.replacing span { flex:1; min-width:0; }
.replacing button { color:#92400e; font-weight:600; padding:0.125rem 0.375rem; border-radius:6px; }

/* Zoeken */
.search { position:relative; padding:0 0.75rem 0.875rem; }
.search svg { position:absolute; left:1.625rem; top:0.75rem; width:18px; height:18px; color:var(--slate-500); pointer-events:none; }
.search .field { padding-left:2.5rem; }

/* Beslissingen */
.decs { list-style:none; border-top:1px solid var(--slate-100); }
.dec { border-bottom:1px solid var(--slate-100); }
.dec:last-child { border-bottom:0; }
.dec-head { width:100%; text-align:left; display:grid; grid-template-columns:1fr auto; gap:0.5rem; padding:0.875rem 1.125rem; align-items:start; }
.dec-head:hover { background:var(--slate-50); }
.dec-what { font-weight:600; color:var(--slate-800); font-size:1rem; line-height:1.4; word-break:break-word; }
.dec-meta { font-size:0.8125rem; color:var(--slate-500); margin-top:0.125rem; }
.dec-why { font-size:0.9375rem; color:var(--slate-600); margin-top:0.375rem; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.dec-link { font-size:0.8125rem; color:var(--slate-500); margin-top:0.375rem; }
.dec-link b { font-weight:600; color:var(--slate-600); }
.chev { width:18px; height:18px; color:var(--slate-300); margin-top:0.125rem; transition:transform 0.2s; }
.dec.open .chev { transform:rotate(180deg); }
.pill { display:inline-block; font-size:0.6875rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; padding:0 0.4375rem; border-radius:999px; margin-right:0.4375rem; vertical-align:1px; line-height:1.6; }
.pill.herzien { color:#92400e; background:#fef3c7; }
.pill.ingetrokken { color:var(--slate-600); background:var(--slate-200); }
.dec.herzien .dec-what, .dec.ingetrokken .dec-what { color:var(--slate-500); }
.dec.ingetrokken .dec-what { text-decoration:line-through; text-decoration-color:var(--slate-300); }
.dec.flash { animation:flash 1.2s ease; }
@keyframes flash { 0% { background:var(--accent-50); } 100% { background:transparent; } }

.dec-edit { padding:0 1.125rem 1.125rem; }
.dec-edit .grid { margin-top:0; }
.status { display:flex; gap:0.375rem; flex-wrap:wrap; }
.status button {
  padding:0.4375rem 0.75rem; border-radius:999px; border:1px solid var(--slate-200); font-size:0.875rem; font-weight:500; color:var(--slate-600); background:var(--wit);
}
.status button[aria-pressed="true"] { background:var(--slate-800); border-color:var(--slate-800); color:var(--wit); }
.edit-actions { display:flex; align-items:center; gap:0.5rem; margin-top:0.875rem; flex-wrap:wrap; }
.btn { padding:0.5rem 0.875rem; border-radius:8px; font-weight:600; font-size:0.875rem; white-space:nowrap; }
.btn-primary { background:var(--accent-dark); color:var(--wit); }
.btn-primary:hover { background:var(--accent-hover); }
.btn-ghost { color:var(--slate-500); }
.btn-ghost:hover { background:var(--slate-100); }
.btn-danger { color:var(--rood); margin-right:auto; padding-left:0.25rem; }
.btn-danger:hover { background:#fef2f2; }
.btn-soft { color:#92400e; background:#fef3c7; }

.empty { padding:2rem 1.25rem 2.25rem; text-align:center; color:var(--slate-500); font-size:0.9375rem; }
.empty strong { display:block; color:var(--slate-600); font-weight:600; margin-bottom:0.25rem; }

/* Menu */
.menu-wrap { position:relative; }
.menu {
  position:absolute; right:0; top:42px; z-index:20; min-width:230px; background:var(--wit); border:1px solid var(--slate-200);
  border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,0.14); padding:0.375rem; display:none;
}
.menu.open { display:block; }
.menu button { width:100%; display:flex; align-items:center; gap:0.625rem; padding:0.5625rem 0.625rem; border-radius:8px; font-size:0.9375rem; text-align:left; color:var(--slate-700); }
.menu button { white-space:nowrap; }
.menu button:hover { background:var(--slate-100); }
.menu button svg { width:18px; height:18px; color:var(--slate-500); flex-shrink:0; }
.menu .sep { height:1px; background:var(--slate-100); margin:0.25rem 0.375rem; }
.menu .danger { color:var(--rood); }
.menu .danger svg { color:var(--rood); }

/* Melding */
.toast {
  position:fixed; left:50%; bottom:calc(var(--bottom) + 1.25rem); transform:translate(-50%, calc(100% + 3rem)); visibility:hidden; z-index:50;
  background:var(--slate-800); color:var(--wit); border-radius:12px; padding:0.625rem 0.625rem 0.625rem 1rem;
  display:flex; align-items:center; gap:0.875rem; font-size:0.9375rem; box-shadow:0 10px 30px rgba(15,23,42,0.25);
  transition:transform 0.25s ease, visibility 0s 0.25s; max-width:calc(100% - 2rem);
}
.toast.show { transform:translate(-50%, 0); visibility:visible; transition:transform 0.25s ease; }
.toast button { color:#6ee7b7; font-weight:600; padding:0.25rem 0.5rem; border-radius:6px; }
.toast button:hover { background:rgba(255,255,255,0.08); }

.footer { text-align:center; padding:2rem 2rem calc(var(--bottom) + 2rem); border-top:1px solid var(--slate-200); background:var(--wit); }
.quote { font-size:0.8125rem; color:var(--accent-dark); }

@media (max-width:640px) {
  .back-link { position:static; margin-bottom:0.75rem; justify-content:center; display:flex; }
}
@media (max-width:480px) {
  .grid { grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* Toegankelijkheid (audit oktober 2026) */
:focus-visible { outline:2px solid #047857 !important; outline-offset:2px; }

.ocw-row .ocw-yes { background:#dc2626; } .ocw-row .ocw-yes:hover { background:#b91c1c; }
.ocw-row button { min-height:44px; }
button.oc-import { color:#047857; min-height:44px; }
</style>

<script>
/* ---------- Overnemen tussen tools (gedeeld door de Onder Constructie-tools, v2) ----------
   Alle tools draaien op hetzelfde domein en delen dus localStorage. Elke tool legt wat hij te bieden
   heeft klaar onder 'oc.share.<tool-id>', in een vaste vorm, zodat andere tools het kunnen overnemen
   zonder elkaars binnenkant te kennen.

   Soorten (type):
     'betrokkene'  persoon, rol, stakeholder, doelgroep of team   { text, note? }
     'taak'        iets dat gedaan moet worden                     { text, note? }
     'actie'       taak met eigenaar en/of termijn                 { text, who?, when? }
     'risico'      risico met kans en impact                       { text, note? }

   Gebruik:
     ocShare.publish('raci', 'RACI-matrix', [
       { name:'Heraanleg stadspark', items:[ { type:'betrokkene', text:'Projectleider' }, { type:'taak', text:'Budget goedkeuren' } ] }
     ]);                                   // aanroepen na elke bewaring
     ocShare.clear('raci');                // bij "Alles wissen"
     const gekozen = await ocShare.pick({ types:['betrokkene'], self:'weerstand', title:'Doelgroepen overnemen' });
     // geeft [] terug bij annuleren, anders de aangevinkte items (met .source en .list erbij)
*/
const ocShare = (() => {
  const PREFIX = 'oc.share.';
  const LABEL = { betrokkene:'betrokkenen', taak:'taken', actie:'acties', risico:"risico's" };
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  function publish(id, tool, lists) {
    try {
      const clean = (lists || []).map(l => ({
        name: String(l.name || '').slice(0, 80),
        items: (l.items || []).filter(i => i && i.type && String(i.text || '').trim())
          .slice(0, 300).map(i => ({ type:i.type, text:String(i.text).trim().slice(0, 300),
            note: i.note ? String(i.note).slice(0, 200) : undefined, who: i.who || undefined, when: i.when || undefined }))
      })).filter(l => l.items.length);
      if (!clean.length) { localStorage.removeItem(PREFIX + id); return; }
      localStorage.setItem(PREFIX + id, JSON.stringify({ id, tool, updated: Date.now(), lists: clean }));
    } catch {}
  }
  function clear(id) { try { localStorage.removeItem(PREFIX + id); } catch {} }

  // Elke bron apart: één kapotte sleutel mag de andere niet verbergen.
  function sources(types, self) {
    const out = [];
    let keys = [];
    try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch { return out; }
    keys.forEach(k => {
      if (!k || !k.startsWith(PREFIX) || k === PREFIX + self) return;
      try {
        const d = JSON.parse(localStorage.getItem(k));
        if (!d || !Array.isArray(d.lists)) return;
        d.lists.forEach(l => {
          if (!l || !Array.isArray(l.items)) return;
          const items = l.items.filter(it => it && types.includes(it.type) && typeof it.text === 'string');
          if (items.length) out.push({ tool: String(d.tool || d.id || k.slice(PREFIX.length)), id: d.id, updated: +d.updated || 0, list: String(l.name || ''), items });
        });
      } catch {}
    });
    return out.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  }

  let styled = false;
  function style() {
    if (styled) return; styled = true;
    const s = document.createElement('style');
    s.textContent = `
      .ocs-back{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45);
        backdrop-filter:blur(3px);opacity:0;transition:opacity .15s;font-family:'DM Sans',system-ui,sans-serif}
      @media(min-width:640px){.ocs-back{align-items:center;padding:1rem}}
      .ocs-back.open{opacity:1}
      .ocs{width:100%;max-width:520px;max-height:min(86vh,720px);display:flex;flex-direction:column;background:#fff;border-radius:18px 18px 0 0;
        box-shadow:0 20px 50px rgba(15,23,42,.25);transform:translateY(12px);transition:transform .15s;color:#1e293b}
      @media(min-width:640px){.ocs{border-radius:18px}}
      .ocs-back.open .ocs{transform:none}
      .ocs-head{padding:1.125rem 1.25rem .75rem;border-bottom:1px solid #e2e8f0}
      .ocs-title{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
      .ocs-sub{font-size:.8125rem;color:#64748b;margin-top:.125rem}
      .ocs-body{overflow:auto;padding:.5rem 1.25rem 1rem;flex:1}
      .ocs-src{margin-top:.875rem}
      .ocs-src-head{display:flex;align-items:center;gap:.5rem;padding:.375rem 0}
      .ocs-src-head b{font-size:.9375rem}
      .ocs-src-head span{font-size:.75rem;color:#64748b}
      .ocs-all{margin-left:auto;font:inherit;font-size:.8125rem;color:#047857;background:none;border:0;cursor:pointer;padding:.25rem .5rem;min-height:44px;border-radius:6px}
      .ocs-all:hover{background:#d1fae5}
      .ocs-item{display:flex;align-items:flex-start;gap:.625rem;padding:.625rem .25rem;min-height:44px;box-sizing:border-box;border-top:1px solid #f1f5f9;cursor:pointer;font-size:.9375rem;line-height:1.4}
      .ocs-item input{width:18px;height:18px;margin-top:.125rem;accent-color:#10b981;flex:none}
      .ocs-item small{display:block;font-size:.75rem;color:#64748b}
      .ocs-empty{padding:1.5rem .25rem;color:#64748b;font-size:.9375rem;line-height:1.5}
      .ocs-foot{display:flex;gap:.5rem;justify-content:flex-end;padding:.875rem 1.25rem calc(.875rem + env(safe-area-inset-bottom,0px));border-top:1px solid #e2e8f0}
      .ocs-btn{font:inherit;font-size:.9375rem;font-weight:600;padding:.625rem 1rem;min-height:44px;border-radius:10px;border:0;cursor:pointer}
      .ocs-cancel{background:#f1f5f9;color:#475569}
      .ocs-ok{background:#047857;color:#fff}.ocs-ok:hover{background:#065f46}
      .ocs-ok:disabled{background:#cbd5e1;color:#334155;cursor:default}
      .ocs-back :focus-visible{outline:2px solid #047857;outline-offset:2px}`;
    document.head.appendChild(s);
  }

  function pick({ types, self, title, intro }) {
    style();
    return new Promise(resolve => {
      const src = sources(types, self);
      const back = document.createElement('div');
      back.className = 'ocs-back';
      const what = types.map(t => LABEL[t] || t).join(' of ');
      back.innerHTML = `<div class="ocs" role="dialog" aria-modal="true" aria-label="${esc(title || 'Overnemen')}">
        <div class="ocs-head"><div class="ocs-title">${esc(title || 'Overnemen uit een andere tool')}</div>
          <div class="ocs-sub">${esc(intro || `Kies welke ${what} je wil overnemen.`)}</div></div>
        <div class="ocs-body">${src.length ? src.map((s, si) => `
          <div class="ocs-src"><div class="ocs-src-head"><b>${esc(s.tool)}</b><span>${esc(s.list)} · ${s.items.length}</span>
            <button class="ocs-all" type="button" data-all="${si}">alles</button></div>
            ${s.items.map((it, ii) => `<label class="ocs-item"><input type="checkbox" data-s="${si}" data-i="${ii}">
              <span>${esc(it.text)}${it.who || it.when || it.note ? `<small>${esc([it.who, it.when, it.note].filter(Boolean).join(' · '))}</small>` : ''}</span></label>`).join('')}
          </div>`).join('') : `<p class="ocs-empty">Er zijn nog geen ${esc(what)} om over te nemen. Vul ze eerst in een andere tool in (bijvoorbeeld de Stakeholder Radar, de RACI-matrix of de Gap-analyse), dan verschijnen ze hier.</p>`}
        </div>
        <div class="ocs-foot"><button class="ocs-btn ocs-cancel" type="button">Annuleer</button>
          <button class="ocs-btn ocs-ok" type="button" disabled>Neem over</button></div></div>`;
      document.body.appendChild(back);
      requestAnimationFrame(() => back.classList.add('open'));
      const ok = back.querySelector('.ocs-ok');
      const boxes = () => [...back.querySelectorAll('input[type=checkbox]')];
      const sync = () => { const n = boxes().filter(b => b.checked).length; ok.disabled = !n; ok.textContent = n ? `Neem ${n} over` : 'Neem over'; };
      back.addEventListener('change', sync);
      back.addEventListener('click', e => {
        const a = e.target.closest('[data-all]');
        if (a) { const bs = boxes().filter(b => b.dataset.s === a.dataset.all); const all = bs.every(b => b.checked); bs.forEach(b => b.checked = !all); sync(); }
        if (e.target === back) close([]);
      });
      function close(v) { document.removeEventListener('keydown', onKey, true); back.remove(); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close([]); } }
      document.addEventListener('keydown', onKey, true);
      back.querySelector('.ocs-cancel').addEventListener('click', () => close([]));
      ok.addEventListener('click', () => close(boxes().filter(b => b.checked).map(b => {
        const s = src[+b.dataset.s]; return { ...s.items[+b.dataset.i], source: s.tool, list: s.list };
      })));
      const first = back.querySelector('input,.ocs-cancel'); first && first.focus();
    });
  }

  // Hoeveel er klaarligt voor deze soorten (om een knop te tonen of een teller te zetten).
  const count = (types, self) => sources(types, self).reduce((n, s) => n + s.items.length, 0);
  return { publish, clear, pick, count, sources, esc };
})();

/* ---------- Alles wissen, klaarleggen en overnemen ---------- */
const OC_ID = 'beslissingen', OC_TOOL = 'Beslissingslog';
let ocSaves = 0, ocPubT = null;
// Wordt bij elke bewaring aangeroepen: telt (voor 'Ongedaan') en legt na een korte pauze klaar voor andere tools.
function ocAfterSave() { ocSaves++; clearTimeout(ocPubT); ocPubT = setTimeout(() => { try { ocPublish(); } catch {} ocRefreshImports(); }, 300); }
function ocRefreshImports() {
  document.querySelectorAll('[data-oc-types]').forEach(b => { b.hidden = !ocShare.count(b.dataset.ocTypes.split(','), OC_ID); });
}
['focus', 'storage'].forEach(ev => window.addEventListener(ev, () => setTimeout(ocRefreshImports, 50)));
document.addEventListener('visibilitychange', () => { if (!document.hidden) ocRefreshImports(); });
setTimeout(() => { try { ocPublish(); } catch {} ocRefreshImports(); }, 0);
// Bevestiging in de pagina (geen pop-up van de browser).
// Stijl van de bevestiging en de knoppen 'Overnemen uit…': meteen laden.
function ocStyle() {
  if (!document.getElementById('ocw-style')) {
    const s = document.createElement('style'); s.id = 'ocw-style';
    s.textContent = `.ocw-back{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);font-family:'DM Sans',system-ui,sans-serif}
      .ocw{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:1.375rem 1.375rem 1.125rem;box-shadow:0 20px 50px rgba(15,23,42,.25);color:#1e293b}
      .ocw b{display:block;font-size:1.0625rem;letter-spacing:-.01em;margin-bottom:.375rem}
      .ocw p{font-size:.9375rem;line-height:1.5;color:#475569}
      .ocw-row{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem}
      .ocw-row button{font:inherit;font-size:.9375rem;font-weight:600;padding:.625rem 1rem;border-radius:10px;border:0;cursor:pointer}
      .ocw-no{background:#f1f5f9;color:#475569} .ocw-yes{background:#ef4444;color:#fff} .ocw-yes:hover{background:#dc2626}
      .oc-import{display:inline-flex;align-items:center;gap:.375rem;font:inherit;font-size:.8125rem;font-weight:600;color:#059669;background:#fff;border:1px dashed #a7f3d0;border-radius:999px;padding:.3125rem .75rem;cursor:pointer;white-space:nowrap}
      .oc-import:hover{background:#ecfdf5;border-color:#10b981} .oc-import svg{width:15px;height:15px} .oc-import[hidden]{display:none}`;
    document.head.appendChild(s);
  }
}
ocStyle();
function ocConfirm(title, text, okText) {
  return new Promise(resolve => {
    const back = document.createElement('div'); back.className = 'ocw-back';
    back.innerHTML = '<div class="ocw" role="alertdialog" aria-modal="true"><b></b><p></p><div class="ocw-row"><button class="ocw-no" type="button">Annuleer</button><button class="ocw-yes" type="button"></button></div></div>';
    back.querySelector('b').textContent = title; back.querySelector('p').textContent = text; back.querySelector('.ocw-yes').textContent = okText;
    document.body.appendChild(back);
    const done = v => { document.removeEventListener('keydown', key, true); back.remove(); resolve(v); };
    const key = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', key, true);
    back.querySelector('.ocw-no').onclick = () => done(false);
    back.querySelector('.ocw-yes').onclick = () => done(true);
    back.addEventListener('click', e => { if (e.target === back) done(false); });
    back.querySelector('.ocw-no').focus();
  });
}
// Ongedaan maken van een wisbeurt kan alleen zolang er sindsdien niets anders bewaard werd.
function ocUndoable(restore) {
  const mark = ocSaves;
  return () => {
    if (ocSaves !== mark) { setTimeout(() => toast('Ongedaan maken kan niet meer: er is intussen iets veranderd'), 60); return; }
    restore();
  };
}

function ocPublish() {}

async function ocWipeAll() {
  if (!await ocConfirm(`Alles wissen in ${OC_TOOL}?`, 'Alle logs en beslissingen verdwijnen. Je kan dit nog ongedaan maken tot je iets anders doet.', 'Alles wissen')) return;
  const copy = JSON.parse(JSON.stringify(state));
  try { localStorage.removeItem(KEY); } catch {}
  state = load(); save(); render();
  ocShare.clear(OC_ID);
  toast('Alles gewist', ocUndoable(() => { state = copy; }));
}
document.addEventListener('click', e => { if (e.target.closest('[data-act="wipe"]')) ocWipeAll(); });


/* ---------- Download als afbeelding of PDF (gedeeld door de Onder Constructie-tools, v2) ----------
   Gebruik:
     ocExport.png(bouwFn, 'bestandsnaam', { landscape:true })
     ocExport.pdf(bouwFn, 'bestandsnaam', { landscape:true })
   bouwFn() geeft { node, title, subtitle } terug: een DOM-knoop met inline styles, zonder knoppen of invoervelden.
   Die komt buiten beeld op een witte pagina met kop (titel, ondertitel, datum) en voet.
   Zet data-oc-keep op blokken die in een PDF niet over twee pagina's gesplitst mogen worden
   (een beslissing, een kaartje, een rij); ze schuiven dan door naar de volgende pagina.
   html2canvas en jsPDF worden pas geladen bij de eerste download, van dezelfde adressen als de
   andere tools, zodat de app ze offline kan bewaren. */
const ocExport = (() => {
  const LIBS = {
    h2c: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    pdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  };
  const A4 = { w: 210, h: 297 }, MARGIN = 10;   // mm
  const loaded = {};
  function load(url) {
    if (!loaded[url]) loaded[url] = new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = url; s.onload = ok; s.onerror = () => { delete loaded[url]; fail(new Error('laden mislukt')); };
      document.head.appendChild(s);
    });
    return loaded[url];
  }
  const today = () => new Date().toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' });
  function page(content, { title, subtitle, width }) {
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:fixed;left:-20000px;top:0;width:${width}px;background:#fff;padding:36px 40px 28px;
      font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:#1e293b;-webkit-font-smoothing:antialiased;box-sizing:border-box;`;
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid #10b981;padding-bottom:12px;margin-bottom:20px;';
    head.innerHTML = `<div><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#1e293b"></div>
      <div style="font-size:14px;color:#64748b;margin-top:2px"></div></div>
      <div style="font-size:12px;color:#94a3b8;white-space:nowrap">${today()}</div>`;
    head.children[0].children[0].textContent = title || '';
    head.children[0].children[1].textContent = subtitle || '';
    const foot = document.createElement('div');
    foot.style.cssText = 'margin-top:22px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;';
    foot.innerHTML = '<span>Onder Constructie</span><span>onderconstructie.github.io</span>';
    wrap.append(head, content, foot);
    document.body.appendChild(wrap);
    return wrap;
  }
  // Schuift blokken met data-oc-keep die over een paginagrens zouden vallen naar de volgende pagina.
  function keepTogether(wrap, pageH) {
    const top0 = () => wrap.getBoundingClientRect().top;
    for (const el of wrap.querySelectorAll('[data-oc-keep]')) {
      const r = el.getBoundingClientRect(), t = r.top - top0(), b = t + r.height;
      if (r.height > pageH * 0.85) continue;            // te groot om heel te houden
      const boundary = Math.ceil(t / pageH) * pageH;     // eerstvolgende grens na de bovenkant
      if (t % pageH !== 0 && b > boundary && t < boundary) {
        const gap = document.createElement('div');
        gap.style.cssText = `height:${boundary - t + 6}px;`;
        el.parentNode.insertBefore(gap, el);
      }
    }
  }
  async function canvasOf(build, opts) {
    await load(LIBS.h2c);
    const built = build();
    const node = page(built.node, { title: built.title, subtitle: built.subtitle, width: opts.width });
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      if (opts.pageH) keepTogether(node, opts.pageH);
      return await window.html2canvas(node, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
    } finally { node.remove(); }
  }
  function save(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  const widthFor = opts => opts.width || (opts.landscape ? 1120 : 800);
  async function png(build, name, opts = {}) {
    const c = await canvasOf(build, { width: widthFor(opts) });
    await new Promise(ok => c.toBlob(b => { save(b, name + '.png'); ok(); }, 'image/png'));
  }
  async function pdf(build, name, opts = {}) {
    const landscape = !!opts.landscape, width = widthFor(opts);
    const pw = landscape ? A4.h : A4.w, ph = landscape ? A4.w : A4.h, w = pw - 2 * MARGIN;
    const pageCss = (ph - 2 * MARGIN) / w * width;       // paginahoogte in CSS-pixels van de exportknoop
    const [c] = await Promise.all([canvasOf(build, { width, pageH: pageCss }), load(LIBS.pdf)]);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: landscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
    const scale = w / c.width, pageH = (ph - 2 * MARGIN) / scale;   // paginahoogte in canvaspixels
    for (let y = 0, i = 0; y < c.height - 2; y += pageH, i++) {
      const h = Math.min(pageH, c.height - y);
      const part = document.createElement('canvas'); part.width = c.width; part.height = h;
      part.getContext('2d').drawImage(c, 0, y, c.width, h, 0, 0, c.width, h);
      if (i) doc.addPage();
      doc.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', MARGIN, MARGIN, w, h * scale);
    }
    save(doc.output('blob'), name + '.pdf');
  }
  return { png, pdf };
})();

/* ---------- Opslag ---------- */
const KEY = 'beslissingen.v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.logs) && d.logs.length) return d; } catch {}
  const first = { id:uid(), name:'Mijn project', items:[] };
  return { logs:[first], current:first.id, lastWho:'' };
}
let state = load();
function save() { ocAfterSave(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
const cur = () => state.logs.find(l => l.id === state.current) || state.logs[0];
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const STATUS = { genomen:'Genomen', herzien:'Herzien', ingetrokken:'Ingetrokken' };
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('nl-BE', { day:'numeric', month:'short', year:'numeric' });
}
function sorted(items) {
  return [...items].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.created - a.created);
}

/* ---------- Toevoegen ---------- */
let openId = null, replacesId = null;
$('add-date').value = today();
$('more-toggle').addEventListener('click', () => {
  const open = $('more').hidden;
  $('more').hidden = !open;
  $('more-toggle').setAttribute('aria-expanded', String(open));
  if (open && !$('add-who').value) $('add-who').value = state.lastWho || '';
});
$('add-form').addEventListener('submit', e => {
  e.preventDefault();
  const what = $('add-what').value.trim();
  if (!what) { $('add-what').focus(); return; }
  // Detailvelden tellen alleen mee als je ze ziet: niets wordt stil ingevuld.
  const more = !$('more').hidden;
  const it = {
    id:uid(), what,
    why:more ? $('add-why').value.trim() : '',
    who:more ? $('add-who').value.trim() : '',
    date:(more && $('add-date').value) || today(),
    alt:more ? $('add-alt').value.trim() : '',
    status:'genomen', note:'', created:Date.now()
  };
  const l = cur();
  if (replacesId) {
    const old = l.items.find(x => x.id === replacesId);
    if (old) { it.replaces = old.id; old.replacedBy = it.id; if (old.status === 'genomen') old.status = 'herzien'; }
  }
  l.items.push(it);
  if (it.who) state.lastWho = it.who;
  save();
  ['add-what', 'add-why', 'add-alt'].forEach(id => $(id).value = '');
  $('add-date').value = today();
  setReplacing(null);
  openId = null;
  render();
  const li = document.querySelector(`.dec[data-id="${it.id}"]`);
  if (li) { li.classList.add('flash'); }
  $('add-what').focus();
});
function setReplacing(id) {
  replacesId = id;
  const old = id && cur().items.find(x => x.id === id);
  $('replacing').hidden = !old;
  if (old) $('replacing-what').textContent = old.what;
}
$('replacing-x').addEventListener('click', () => setReplacing(null));

/* ---------- Tekenen ---------- */
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function decHTML(it, l) {
  const meta = [fmtDate(it.date), it.who].filter(Boolean).join(' · ');
  const pill = it.status !== 'genomen' ? `<span class="pill ${it.status}">${STATUS[it.status]}</span>` : '';
  const metaLine = (pill || meta) ? `<span class="dec-meta" style="display:block">${pill}${esc(meta)}</span>` : '';
  const by = it.replacedBy && l.items.find(x => x.id === it.replacedBy);
  const rep = it.replaces && l.items.find(x => x.id === it.replaces);
  const links = (by ? `<p class="dec-link">Vervangen door: <b>${esc(by.what)}</b></p>` : '') +
                (rep ? `<p class="dec-link">Vervangt: <b>${esc(rep.what)}</b></p>` : '');
  const open = it.id === openId;
  const head = `<button class="dec-head" aria-expanded="${open}">
      <span>
        <span class="dec-what" style="display:block">${esc(it.what)}</span>
        ${metaLine}
        ${!open && it.why ? `<span class="dec-why">${esc(it.why)}</span>` : ''}
        ${!open && it.note ? `<span class="dec-why">${esc(it.note)}</span>` : ''}
        ${!open ? links : ''}
      </span>${CHEV}
    </button>`;
  if (!open) return `<li class="dec ${it.status}" data-id="${it.id}">${head}</li>`;
  return `<li class="dec open ${it.status}" data-id="${it.id}">${head}
    <div class="dec-edit">
      <div class="grid">
        <label class="full"><span class="lbl">Beslissing</span><input class="field" data-f="what" value="${esc(it.what)}" maxlength="300"></label>
        <label class="full"><span class="lbl">Waarom</span><textarea class="field" data-f="why" maxlength="2000">${esc(it.why)}</textarea></label>
        <label><span class="lbl">Beslist door</span><input class="field" data-f="who" value="${esc(it.who)}" maxlength="120" list="who-list"></label>
        <label><span class="lbl">Datum</span><input class="field" data-f="date" type="date" value="${esc(it.date)}"></label>
        <label class="full"><span class="lbl">Alternatieven die afvielen</span><textarea class="field" data-f="alt" maxlength="2000">${esc(it.alt)}</textarea></label>
        <div class="full"><span class="lbl">Status</span>
          <div class="status" role="group" aria-label="Status">
            ${Object.entries(STATUS).map(([k, v]) => `<button type="button" data-status="${k}" aria-pressed="${it.status === k}">${v}</button>`).join('')}
          </div>
        </div>
        <label class="full" ${it.status === 'genomen' ? 'hidden' : ''}><span class="lbl">${it.status === 'herzien' ? 'Wat is er veranderd, en waarom?' : 'Waarom ingetrokken?'}</span><textarea class="field" data-f="note" maxlength="2000">${esc(it.note)}</textarea></label>
        ${links ? `<div class="full">${links}</div>` : ''}
      </div>
      <div class="edit-actions">
        <button type="button" class="btn btn-danger" data-act="del">Verwijder</button>
        ${it.status === 'herzien' && !by ? `<button type="button" class="btn btn-soft" data-act="replace">Nieuwe beslissing koppelen</button>` : ''}
        <button type="button" class="btn btn-primary" data-act="close">Klaar</button>
      </div>
    </div>
  </li>`;
}

function renderTabs() {
  $('lists').innerHTML = state.logs.map(l =>
    `<button class="tab${l.id === state.current ? ' active' : ''}" data-log="${l.id}">${esc(l.name || 'Naamloos')}<span class="n">${l.items.length || ''}</span></button>`
  ).join('') + `<button class="tab add" id="new-log" aria-label="Nieuwe log">+ Log</button>`;
}

function matches(it, q) {
  if (!q) return true;
  return [it.what, it.why, it.who, it.alt, it.note, it.date, fmtDate(it.date), STATUS[it.status]].join(' ').toLowerCase().includes(q);
}

function render() {
  const l = cur();
  if (document.activeElement !== $('list-name')) $('list-name').value = l.name;
  const delLabel = `Verwijder ${l.name || 'Naamloos'}`;
  $('del-btn').setAttribute('aria-label', delLabel); $('del-btn').title = delLabel;
  const total = l.items.length;
  const q = $('search').value.trim().toLowerCase();
  $('search-wrap').hidden = total <= 5 && !q;
  const list = sorted(l.items).filter(it => matches(it, q));
  $('decs').innerHTML = list.map(it => decHTML(it, l)).join('');
  $('decs').hidden = list.length === 0;

  const active = l.items.filter(i => i.status === 'genomen').length;
  $('count-line').textContent = total
    ? `${total} ${total === 1 ? 'beslissing' : 'beslissingen'}${active !== total ? `, ${active} van kracht` : ''}`
    : '';
  $('count-line').hidden = !total;

  $('empty').hidden = list.length !== 0;
  $('empty').innerHTML = total
    ? `<strong>Niets gevonden</strong>Geen beslissing bevat “${esc(q)}”.`
    : '<strong>Nog geen beslissingen</strong>Wie vastlegt wat beslist is en waarom, hoeft de discussie niet opnieuw te voeren.';

  document.querySelectorAll('.dec-edit textarea').forEach(grow);
  const whos = [...new Set(state.logs.flatMap(x => x.items.map(i => i.who)).filter(Boolean))];
  $('who-list').innerHTML = whos.map(w => `<option value="${esc(w)}">`).join('');
  renderTabs();
}

/* ---------- Bewerken ---------- */
function grow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 3, 400) + 'px'; }
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('textarea.field')) grow(e.target); });
function findIt(el) {
  const li = el.closest('.dec'); if (!li) return {};
  const l = cur(); const idx = l.items.findIndex(i => i.id === li.dataset.id);
  return { li, l, idx, it:l.items[idx] };
}
$('decs').addEventListener('click', e => {
  const head = e.target.closest('.dec-head');
  if (head) {
    const { it } = findIt(head); if (!it) return;
    openId = openId === it.id ? null : it.id;
    render();
    const li = document.querySelector(`.dec[data-id="${it.id}"]`);
    if (openId && li) li.scrollIntoView({ block:'nearest', behavior:'smooth' });
    return;
  }
  const st = e.target.closest('[data-status]');
  if (st) {
    const { it } = findIt(st); if (!it) return;
    it.status = st.dataset.status; save(); render();
    const note = document.querySelector(`.dec[data-id="${it.id}"] [data-f="note"]`);
    if (note && it.status !== 'genomen') note.focus();
    return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const { l, idx, it } = findIt(act); if (!it) return;
  if (act.dataset.act === 'close') { openId = null; render(); }
  if (act.dataset.act === 'replace') {
    openId = null; render(); setReplacing(it.id);
    $('add-what').focus(); $('add-form').scrollIntoView({ block:'center', behavior:'smooth' });
  }
  if (act.dataset.act === 'del') {
    const restore = snapshot();
    l.items.splice(idx, 1);
    l.items.forEach(x => { if (x.replacedBy === it.id) delete x.replacedBy; if (x.replaces === it.id) delete x.replaces; });
    openId = null; save(); render();
    toast('Beslissing verwijderd', restore);
  }
});
$('decs').addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const { it } = findIt(e.target); if (!it) return;
  it[f] = e.target.value;
  if (f === 'who' && it.who.trim()) state.lastWho = it.who.trim();
  save(); renderTabs();
});
$('decs').addEventListener('focusout', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const { it } = findIt(e.target); if (!it) return;
  if (f === 'what' && !it.what.trim()) { it.what = e.target.defaultValue || 'Zonder titel'; e.target.value = it.what; }
  if (typeof it[f] === 'string') it[f] = it[f].trim();
  save();
});
$('decs').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.field')) { e.preventDefault(); openId = null; render(); }
  if (e.key === 'Escape' && openId) { openId = null; render(); }
});
$('search').addEventListener('input', render);

/* ---------- Ongedaan maken ---------- */
let undoFn = null, toastTimer = null;
function toast(msg, undo) {
  undoFn = undo || null;
  $('toast-text').textContent = msg;
  $('toast-btn').hidden = !undo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').classList.remove('show'); undoFn = null; }, undo ? 6000 : 2500);
}
$('toast-btn').addEventListener('click', () => {
  if (undoFn) { undoFn(); undoFn = null; save(); render(); }
  $('toast').classList.remove('show');
});
function snapshot() { const copy = JSON.parse(JSON.stringify(state)); return () => { state = copy; }; }

/* ---------- Logs ---------- */
$('lists').addEventListener('click', e => {
  if (e.target.closest('#new-log')) { newLog(); return; }
  const t = e.target.closest('[data-log]'); if (!t) return;
  state.current = t.dataset.log; openId = null; setReplacing(null); $('search').value = ''; save(); render();
});
function newLog() {
  const l = { id:uid(), name:'Nieuwe log', items:[] };
  state.logs.push(l); state.current = l.id; openId = null; setReplacing(null); $('search').value = '';
  save(); render();
  $('list-name').focus(); $('list-name').select();
  requestAnimationFrame(() => { const a = document.querySelector('.tab.active'); a && a.scrollIntoView({ inline:'nearest', block:'nearest' }); });
}
$('list-name').addEventListener('input', () => { cur().name = $('list-name').value.slice(0, 60); save(); renderTabs(); });
$('list-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('add-what').focus(); } });
$('list-name').addEventListener('blur', () => { if (!cur().name.trim()) { cur().name = 'Naamloos'; save(); render(); } });

/* ---------- Menu ---------- */
function closeMenu() { $('menu').classList.remove('open'); $('menu-btn').setAttribute('aria-expanded', 'false'); }
$('menu-btn').addEventListener('click', e => {
  e.stopPropagation();
  const open = !$('menu').classList.contains('open');
  $('menu').classList.toggle('open', open); $('menu-btn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

$('menu').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  closeMenu();
  const l = cur(), act = b.dataset.act;
  if ((act === 'copy' || act === 'csv' || act === 'pdf' || act === 'png') && !l.items.length) { toast('De log is nog leeg'); return; }
  if (act === 'pdf' || act === 'png') {
    const q = $('search').value.trim();
    if (!sorted(l.items).some(it => matches(it, q.toLowerCase()))) { toast('Niets om te downloaden met deze zoekterm'); return; }
    toast('Bezig…');
    try {
      const name = exportName(l);
      if (act === 'pdf') { await ocExport.pdf(() => buildExport(l, q, true), name); toast('PDF gedownload'); }
      else { await ocExport.png(() => buildExport(l, q), name); toast('Afbeelding gedownload'); }
    } catch { toast('Downloaden lukt nu niet: geen verbinding?'); }
    return;
  }
  if (act === 'copy') (await copy(markdown(l))) ? toast('Gekopieerd als tekst') : toast('Kopiëren lukt hier niet');
  if (act === 'csv') { downloadCSV(l); toast('CSV gedownload'); }
  if (act === 'delete') deleteLog(l);
});
/* Eén log verwijderen: meteen, met Ongedaan (herstelt ook de plaats in de tabs en de actieve log) */
function deleteLog(l) {
  const restore = snapshot();
  const idx = state.logs.findIndex(x => x.id === l.id);
  state.logs = state.logs.filter(x => x.id !== l.id);
  if (!state.logs.length) state.logs.push({ id:uid(), name:'Mijn project', items:[] });
  state.current = state.logs[Math.min(Math.max(idx - 1, 0), state.logs.length - 1)].id;
  openId = null; setReplacing(null); $('search').value = ''; save(); render();
  try { ocPublish(); } catch {}
  toast(`${l.name || 'Naamloos'} verwijderd`, () => { restore(); openId = null; try { ocPublish(); } catch {} });
}
$('del-btn').addEventListener('click', () => { closeMenu(); deleteLog(cur()); });

/* ---------- Export: schone weergave voor PDF en afbeelding ---------- */
function exportName(l) {
  const slug = (l.name || 'log').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'log';
  return `beslissingen-${slug}-${today()}`;
}
function buildExport(l, q, paginate) {
  const qq = (q || '').toLowerCase();
  const list = sorted(l.items).filter(it => matches(it, qq));
  const node = document.createElement('div');
  const C = { text:'#1e293b', soft:'#475569', muted:'#94a3b8', line:'#e2e8f0', accent:'#059669' };
  const lab = t => `<div style="font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:${C.muted};margin:10px 0 2px">${t}</div>`;
  const para = (t, col) => `<div style="font-size:14px;line-height:1.55;color:${col || C.soft};white-space:pre-wrap;word-break:break-word">${esc(t)}</div>`;
  node.innerHTML = list.map((it, i) => {
    const gone = it.status !== 'genomen';
    const nr = list.length - i;
    const meta = [fmtDate(it.date), it.who && `beslist door ${esc(it.who)}`].filter(Boolean).join(' · ');
    const pillCol = it.status === 'ingetrokken' ? '#b91c1c' : '#b45309', pillBg = it.status === 'ingetrokken' ? '#fef2f2' : '#fffbeb';
    const pill = gone ? `<span style="display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;color:${pillCol};background:${pillBg};vertical-align:3px">${STATUS[it.status]}</span>` : '';
    const rep = it.replaces && l.items.find(x => x.id === it.replaces);
    const by = it.replacedBy && l.items.find(x => x.id === it.replacedBy);
    return `<div class="x-dec" style="display:grid;grid-template-columns:38px 1fr;gap:0 10px;padding:16px 0 18px;${i ? `border-top:1px solid ${C.line};` : ''}">
      <div style="font-size:13px;font-weight:700;color:${gone ? C.muted : C.accent};padding-top:2px;font-variant-numeric:tabular-nums">${nr}</div>
      <div style="${gone ? 'opacity:0.72;' : ''}">
        <div style="font-size:16.5px;font-weight:700;line-height:1.4;color:${C.text};${it.status === 'ingetrokken' ? 'text-decoration:line-through;text-decoration-color:#cbd5e1;' : ''}">${esc(it.what)}${pill}</div>
        ${meta ? `<div style="font-size:12.5px;color:${C.muted};margin-top:3px">${meta}</div>` : ''}
        ${it.why ? lab('Waarom') + para(it.why) : ''}
        ${it.alt ? lab('Afgevallen alternatieven') + para(it.alt) : ''}
        ${gone && it.note ? lab(it.status === 'ingetrokken' ? 'Ingetrokken' : 'Herzien') + para(it.note) : ''}
        ${rep ? `<div style="font-size:12.5px;color:${C.soft};margin-top:8px">Vervangt: <em>${esc(rep.what)}</em></div>` : ''}
        ${by ? `<div style="font-size:12.5px;color:${C.soft};margin-top:8px">Vervangen door: <em>${esc(by.what)}</em></div>` : ''}
      </div></div>`;
  }).join('');
  const n = list.length;
  const sub = `${l.name || 'Naamloos'} · ${n} ${n === 1 ? 'beslissing' : 'beslissingen'}` + (q ? ` · gefilterd op: ${q}` : '');
  if (paginate) keepTogether(node, 'Beslissingslog', sub);
  return { node, title:'Beslissingslog', subtitle:sub };
}
/* Voor de PDF: een beslissing die over een paginagrens zou vallen, begint op de volgende pagina.
   We bouwen daarvoor dezelfde pagina na als ocExport (800px breed inclusief marges, zelfde kop), meten, en
   duwen blokken naar beneden. A4 staand met 10 mm marge: 277 mm hoogte op 190 mm breedte. */
function keepTogether(node, title, sub) {
  const W = 800, pageH = 277 * W / 190, gap = 28;   // de pagina is 800px breed (box-sizing: border-box)
  const probe = document.createElement('div');
  probe.style.cssText = `position:fixed;left:-20000px;top:0;width:800px;background:#fff;padding:36px 40px 28px;
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;`;
  probe.innerHTML = `<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid #10b981;padding-bottom:12px;margin-bottom:20px;">
    <div><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em"></div><div style="font-size:14px;margin-top:2px"></div></div>
    <div style="font-size:12px;white-space:nowrap">00 september 0000</div></div>`;
  probe.firstElementChild.children[0].children[0].textContent = title;
  probe.firstElementChild.children[0].children[1].textContent = sub;
  probe.appendChild(node);
  document.body.appendChild(probe);
  try {
    const top0 = probe.getBoundingClientRect().top;
    for (const el of node.querySelectorAll('.x-dec')) {
      const r = el.getBoundingClientRect(), t = r.top - top0, b = r.bottom - top0;
      const page = Math.floor(t / pageH);
      if (b > (page + 1) * pageH - 6 && r.height < pageH * 0.85) {
        el.style.marginTop = ((page + 1) * pageH - t + gap) + 'px';
        el.style.borderTop = 'none';
      }
    }
  } finally { probe.remove(); node.remove(); }
}

function markdown(l) {
  const out = [`# Beslissingen: ${l.name}`, ''];
  for (const it of sorted(l.items)) {
    const tag = it.status !== 'genomen' ? ` (${STATUS[it.status].toLowerCase()})` : '';
    out.push(`## ${it.what}${tag}`);
    const meta = [fmtDate(it.date), it.who && `beslist door ${it.who}`].filter(Boolean).join(', ');
    if (meta) out.push(`*${meta}*`, '');
    if (it.why) out.push(`**Waarom:** ${it.why}`, '');
    if (it.alt) out.push(`**Afgevallen:** ${it.alt}`, '');
    if (it.note) out.push(`**${it.status === 'ingetrokken' ? 'Ingetrokken' : 'Herzien'}:** ${it.note}`, '');
    const by = it.replacedBy && l.items.find(x => x.id === it.replacedBy);
    if (by) out.push(`**Vervangen door:** ${by.what}`, '');
    if (out[out.length - 1] !== '') out.push('');
  }
  return out.join('\n').trim() + '\n';
}
function downloadCSV(l) {
  const cell = v => `"${String(v || '').replace(/"/g, '""').replace(/\r?\n/g, ' ')}"`;
  const rows = [['Datum', 'Beslissing', 'Waarom', 'Beslist door', 'Alternatieven', 'Status', 'Notitie']]
    .concat(sorted(l.items).map(it => [it.date, it.what, it.why, it.who, it.alt, STATUS[it.status], it.note]));
  const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `beslissingen-${(l.name || 'log').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'log'}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
  } catch { return false; }
}

/* ---------- Andere tabbladen gelijk houden ---------- */
window.addEventListener('storage', e => { if (e.key === KEY) { state = load(); render(); } });

render();
</script>
</body>
