<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina niet gevonden – Onder Constructie</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
* { box-sizing:border-box; margin:0; }
body { min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:1.5rem 1rem; font-family:"DM Sans", system-ui, sans-serif; background:#f8fafc; color:#1e293b; line-height:1.5; }
main { width:100%; max-width:26rem; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:2rem 1.5rem; text-align:center; }
svg { width:56px; height:56px; }
h1 { margin-top:1rem; font-size:1.375rem; font-weight:700; letter-spacing:-0.01em; }
p { margin-top:0.5rem; color:#475569; }
.knoppen { margin-top:1.5rem; display:grid; gap:0.625rem; justify-content:center; grid-template-columns:minmax(0, 17rem); }
a { display:flex; align-items:center; justify-content:center; min-height:48px; padding:0.5rem 1rem; border-radius:10px; font-weight:600; text-decoration:none; }
.hoofd { background:#0c8660; color:#fff; } .hoofd:hover { background:#047857; }
.tweede { background:#ecfdf5; color:#047857; box-shadow:inset 0 0 0 1px #a7f3d0; } .tweede:hover { background:#d1fae5; }
a:focus-visible { outline:2px solid #047857; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><path d="M20 12v9" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="27" r="1.75" fill="#10b981"/></svg>
  <h1>Deze pagina bestaat niet</h1>
  <p>Misschien is het adres veranderd of zit er een tikfout in. Je werk in de tools staat nog op je toestel.</p>
  <div class="knoppen">
    <a class="hoofd" href="/">Naar de start</a>
  </div>
</main>
</body>
</html>
