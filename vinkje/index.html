<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root {
  --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1; --slate-200:#e2e8f0;
  --slate-100:#f1f5f9; --slate-50:#f8fafc; --wit:#ffffff;
  --accent:#10b981; --accent-dark:#047857; --accent-hover:#065f46; --accent-light:#d1fae5; --accent-50:#ecfdf5;
  --rood:#ef4444;
  --bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'DM Sans', system-ui, sans-serif; background:var(--slate-50); color:var(--slate-700);
  line-height:1.5; min-height:100vh;min-height:100dvh; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
button, input { font:inherit; color:inherit; }
button { background:none; border:0; cursor:pointer; }
[hidden] { display:none !important; }

/* Kop */
.header { background:var(--wit); border-bottom:1px solid var(--slate-200); padding:1.5rem 1.25rem 1.75rem; position:relative; text-align:center; }
.back-link {
  position:absolute; top:1.25rem; left:1.25rem; display:inline-flex; align-items:center; gap:0.5rem;
  font-size:0.875rem; color:var(--slate-500); text-decoration:none; transition:color 0.2s;
}
.back-link:hover { color:var(--accent-dark); }
.back-link svg { width:16px; height:16px; }
.logo svg { width:56px; height:56px; }
.title { font-size:1.625rem; font-weight:700; color:var(--slate-800); letter-spacing:-0.03em; line-height:1.2; margin-top:0.5rem; }
.subtitle { font-size:0.9375rem; color:var(--slate-500); }

.main { flex:1; width:100%; max-width:640px; margin:0 auto; padding:1.25rem 1rem 3rem; }

/* Lijstkeuze */
.lists { display:flex; gap:0.5rem; overflow-x:auto; scrollbar-width:none; margin:-0.25rem -1rem 0.75rem; padding:0.375rem 1rem; }
.lists::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; padding:0.4375rem 0.875rem; border-radius:999px; font-size:0.875rem; font-weight:600;
  border:1px solid var(--slate-200); background:var(--wit); color:var(--slate-600); white-space:nowrap;
  display:flex; align-items:center; gap:0.375rem;
}
.tab .n { font-size:0.75rem; font-weight:500; color:var(--slate-500); font-variant-numeric:tabular-nums; }
.tab.active { background:var(--slate-800); border-color:var(--slate-800); color:var(--wit); }
.tab.active .n { color:var(--slate-300); }
.tab.add { color:var(--accent-dark); border-style:dashed; }

/* Kaart */
.card { background:var(--wit); border:1px solid var(--slate-200); border-radius:16px; box-shadow:0 1px 2px rgba(15,23,42,0.04); overflow:hidden; }
.card-head { display:flex; align-items:center; gap:0.5rem; padding:1rem 0.75rem 0.75rem 1.125rem; }
.list-name {
  flex:1; min-width:0; font-size:1.25rem; font-weight:700; color:var(--slate-800); letter-spacing:-0.02em;
  border:0; background:none; outline:none; padding:0.125rem 0; border-bottom:1.5px solid transparent;
}
.list-name:focus, .list-name:focus-visible { border-bottom-color:var(--accent);  }
.icon-btn { width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--slate-500); flex-shrink:0; }
.icon-btn:hover { background:var(--slate-100); color:var(--slate-700); }
.icon-btn svg { width:20px; height:20px; }
.icon-btn.icon-del:hover { background:#fef2f2; color:#b91c1c; }

.progress { padding:0 1.125rem 0.875rem; }
.progress-text { display:flex; justify-content:space-between; font-size:0.8125rem; color:var(--slate-500); margin-bottom:0.375rem; font-variant-numeric:tabular-nums; }
.progress-text strong { color:var(--slate-700); font-weight:600; }
.bar { height:6px; background:var(--slate-100); border-radius:99px; overflow:hidden; }
.bar span { display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width 0.3s ease; }
.card.all-done .progress-text strong { color:var(--accent-dark); }

/* Invoer */
.add-row { display:flex; gap:0.5rem; padding:0 0.75rem 0.75rem 0.75rem; }
.add-input {
  flex:1; min-width:0; padding:0.6875rem 0.875rem; border:1.5px solid var(--slate-200); border-radius:10px;
  background:var(--slate-50); outline:none; font-size:1rem; transition:border-color 0.15s, background 0.15s;
}
.add-input:focus { border-color:var(--accent); background:var(--wit); }
.add-input::placeholder { color:var(--slate-400); }
.add-btn { width:46px; border-radius:10px; background:var(--accent-dark); color:var(--wit); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.add-btn:hover { background:var(--accent-hover); }
.add-btn svg { width:22px; height:22px; }
.hint { font-size:0.75rem; color:var(--slate-500); padding:0 1.125rem 0.75rem; margin-top:-0.375rem; }

/* Items */
.items { list-style:none; border-top:1px solid var(--slate-100); }
.item {
  display:grid; grid-template-columns:44px 1fr auto; align-items:center; min-height:52px;
  border-bottom:1px solid var(--slate-100); background:var(--wit); position:relative;
}
.item:last-child { border-bottom:0; }
.check { width:44px; height:52px; display:flex; align-items:center; justify-content:center; }
.box {
  width:22px; height:22px; border-radius:7px; border:2px solid var(--slate-300); display:flex; align-items:center; justify-content:center;
  transition:background 0.15s, border-color 0.15s, transform 0.15s;
}
.box svg { width:14px; height:14px; color:var(--wit); opacity:0; transform:scale(0.5); transition:opacity 0.15s, transform 0.2s cubic-bezier(.3,1.6,.6,1); }
.check:hover .box { border-color:var(--accent); }
.item.done .box { background:var(--accent); border-color:var(--accent); }
.item.done .box svg { opacity:1; transform:none; }
.check:active .box { transform:scale(0.88); }
.text {
  padding:0.75rem 0.25rem 0.75rem 0; font-size:1rem; color:var(--slate-800); word-break:break-word; outline:none; cursor:text; min-width:0;
}
.text:focus { color:var(--slate-900); }
.item.done .text { color:var(--slate-500); text-decoration:line-through; text-decoration-color:var(--slate-300); }
.item-actions { display:flex; align-items:center; padding-right:0.25rem; }
.del, .grip { width:36px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--slate-300); border-radius:8px; }
.del:hover { color:var(--rood); }
.grip { cursor:grab; touch-action:none; }
.grip:hover { color:var(--slate-500); }
.del svg, .grip svg { width:18px; height:18px; }
.item.dragging { box-shadow:0 8px 24px rgba(15,23,42,0.14); z-index:5; border-radius:10px; border-bottom-color:transparent; }
.item.placeholder-anim { transition:transform 0.15s ease; }
@media (hover:hover) { .item .del { opacity:0; } .item:hover .del, .item:focus-within .del { opacity:1; } }

.done-head {
  width:100%; display:flex; align-items:center; gap:0.5rem; padding:0.625rem 1.125rem; font-size:0.8125rem; font-weight:600;
  color:var(--slate-500); background:var(--slate-50); border-top:1px solid var(--slate-100); border-bottom:1px solid var(--slate-100);
  text-align:left;
}
.done-head svg { width:16px; height:16px; transition:transform 0.2s; }
.done-head.closed svg { transform:rotate(-90deg); }
.done-head .clear { margin-left:auto; font-weight:500; color:var(--slate-500); padding:0.125rem 0.375rem; border-radius:6px; }
.done-head .clear:hover { color:var(--rood); background:#fef2f2; }
.done-head:focus-visible { outline-offset:-3px !important; }   /* de kaart knipt een ring buiten de knop af */

.empty { padding:2rem 1.25rem 2.25rem; text-align:center; color:var(--slate-500); font-size:0.9375rem; }
.empty strong { display:block; color:var(--slate-600); font-weight:600; margin-bottom:0.25rem; }

/* Menu */
.menu-wrap { position:relative; }
.menu {
  position:absolute; right:0; top:42px; z-index:20; min-width:230px; background:var(--wit); border:1px solid var(--slate-200);
  border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,0.14); padding:0.375rem; display:none;
}
.menu.open { display:block; }
.menu button { width:100%; display:flex; align-items:center; gap:0.625rem; padding:0.5625rem 0.625rem; border-radius:8px; font-size:0.9375rem; text-align:left; color:var(--slate-700); }
.menu button:hover { background:var(--slate-100); }
.menu button svg { width:18px; height:18px; color:var(--slate-500); flex-shrink:0; }
.menu .sep { height:1px; background:var(--slate-100); margin:0.25rem 0.375rem; }
.menu .danger { color:#dc2626; }
.menu .danger svg { color:#dc2626; }
/* het menu mag buiten een korte kaart uitsteken */
.card:has(.menu.open) { overflow:visible; }

/* Gedeelde lijst */
.import {
  display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; padding:0.875rem 1rem; background:var(--wit);
  border:1.5px solid var(--accent-light); border-radius:12px; font-size:0.9375rem;
}
.import p { flex:1; color:var(--slate-600); }
.import strong { color:var(--slate-800); }
.btn { padding:0.5rem 0.875rem; border-radius:8px; font-weight:600; font-size:0.875rem; white-space:nowrap; }
.btn-primary { background:var(--accent-dark); color:var(--wit); }
.btn-ghost { color:var(--slate-500); }

/* Melding */
.toast {
  position:fixed; left:50%; bottom:calc(var(--bottom) + 1.25rem); transform:translate(-50%, calc(100% + 3rem)); visibility:hidden; z-index:50;
  background:var(--slate-800); color:var(--wit); border-radius:12px; padding:0.625rem 0.625rem 0.625rem 1rem;
  display:flex; align-items:center; gap:0.875rem; font-size:0.9375rem; box-shadow:0 10px 30px rgba(15,23,42,0.25);
  transition:transform 0.25s ease, visibility 0s 0.25s; max-width:calc(100% - 2rem);
}
.toast.show { transform:translate(-50%, 0); visibility:visible; transition:transform 0.25s ease; }
.toast button { color:#6ee7b7; font-weight:600; padding:0.25rem 0.5rem; border-radius:6px; }
.toast button:hover { background:rgba(255,255,255,0.08); }

.footer { text-align:center; padding:2rem 2rem calc(var(--bottom) + 2rem); border-top:1px solid var(--slate-200); background:var(--wit); }
.quote { font-size:0.8125rem; color:var(--accent-dark); }

@media (max-width:640px) {
  .back-link { position:static; margin-bottom:0.75rem; justify-content:center; display:flex; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

/* Toegankelijkheid (audit oktober 2026) */
:focus-visible { outline:2px solid #047857 !important; outline-offset:2px; }
.back-link { min-height:44px; min-width:44px; }
.icon-btn, #menu-btn { min-width:44px; min-height:44px; }
.tab { min-height:44px; }
.btn { min-height:44px; }
.list-name { min-height:44px; }
/* Voorbeeld */
.vb-bar { display:flex; flex-wrap:wrap; align-items:center; gap:0.5rem 0.75rem; margin:0 0 1rem; padding:0.5rem 0.5rem 0.5rem 0.75rem; background:#fffbeb; border:1px solid #fde68a; border-radius:12px; font-size:0.875rem; line-height:1.4; color:#78350f; }
.vb-bar svg { width:18px; height:18px; flex-shrink:0; color:#b45309; }
.vb-text { flex:1 1 14rem; min-width:0; display:flex; gap:0.5rem; align-items:flex-start; }
.vb-btns { display:flex; flex-wrap:wrap; gap:0.375rem; }
.vb-btn { min-height:44px; padding:0.375rem 0.625rem; border-radius:10px; font-size:0.875rem; font-weight:600; background:#fff; border:1px solid #e2e8f0; }
.vb-wis { color:#b91c1c; border-color:#fecaca; }
.vb-eigen { color:#047857; border-color:#a7f3d0; }
.vb-tag { font-size:0.75rem; font-weight:600; padding:0 0.375rem; border-radius:999px; background:#fef3c7; color:#92400e; }
.tab.active .vb-tag { background:#fde68a; }
.ex-btn { margin-top:0.75rem; min-height:44px; padding:0 1rem; border-radius:10px; border:1.5px solid #a7f3d0; background:#fff; color:#047857; font-size:0.875rem; font-weight:600; }
.ex-btn:hover { background:#ecfdf5; }
/* Zichtbare download */
.export-row { display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem; }
.export-row .exp-btn { min-height:44px; display:inline-flex; align-items:center; gap:0.5rem; padding:0 0.875rem; border-radius:10px; background:#f1f5f9; color:#475569; font-size:0.875rem; font-weight:600; white-space:nowrap; }
.export-row .exp-btn:hover { background:#e2e8f0; color:#1e293b; }
.export-row .exp-btn svg { width:16px; height:16px; flex:none; }
.toast button { min-height:44px; }
.menu button { min-height:44px; }
.del, .grip { width:44px; }
.del { color:#64748b; }
.del:hover { color:#b91c1c; background:#fef2f2; }
.grip { color:#94a3b8; }
.done-head .clear { display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; margin:-0.5rem 0; }
.ocw-row .ocw-yes { background:#dc2626; } .ocw-row .ocw-yes:hover { background:#b91c1c; }
.ocw-row button { min-height:44px; }
button.oc-import { color:#047857; min-height:44px; }

/* Lege invoer */
.err { margin:-0.25rem 0.75rem 0.75rem; font-size:0.875rem; font-weight:500; color:#b91c1c; }
.add-input[aria-invalid="true"] { border-color:#dc2626; background:#fff; }
/* Wie en tegen wanneer: licht, alleen als je het aanzet */
.oc-import-row { display:flex; flex-wrap:wrap; gap:0.25rem 0.5rem; align-items:center; }
.who-toggle { display:inline-flex; align-items:center; gap:0.375rem; min-height:44px; padding:0 0.5rem; margin-left:-0.25rem; border-radius:8px; font-size:0.8125rem; font-weight:600; color:#475569; }
.who-toggle svg { width:16px; height:16px; flex:none; }
.who-toggle:hover { background:var(--slate-100); }
.who-toggle[aria-pressed="true"] { color:var(--accent-dark); background:var(--accent-50); }
.item .body { min-width:0; display:flex; flex-direction:column; }
.item .body .text { padding-bottom:0.25rem; }
.item .body .text:only-child { padding-bottom:0.75rem; }
.item-meta { font-size:0.8125rem; color:var(--slate-500); padding:0 0.25rem 0.625rem 0; font-variant-numeric:tabular-nums; }
.item-fields { display:flex; flex-wrap:wrap; gap:0.375rem; padding:0 0.25rem 0.625rem 0; }
.item-fields label { display:flex; align-items:center; gap:0.25rem; min-height:44px; border:1px solid var(--slate-200); border-radius:8px; padding:0 0.5rem; background:var(--slate-50); font-size:0.8125rem; color:var(--slate-500); }
.item-fields label:focus-within { border-color:var(--accent); background:#fff; }
.item-fields svg { width:14px; height:14px; flex:none; }
.item-meta .late { color:#b45309; font-weight:600; }
.item-fields label.late { border-color:#f59e0b; background:#fffbeb; color:#b45309; }
.item-fields input { border:0; background:none; outline:none; font-size:0.875rem; color:var(--slate-700); min-width:0; min-height:42px; }
.item-fields input[type=text] { width:7.5rem; }
.item-fields input[type=date] { width:8.5rem; }
.item.done .item-fields { display:none; }

/* Opnieuw beginnen (zelfde knop in elke tool) */
.oc-restart-row { display:flex; justify-content:center; padding:0.5rem 0 0; }
.oc-restart-row[hidden] { display:none !important; }
.oc-restart { min-height:44px; padding:0.5rem 1rem; font:inherit; font-size:0.875rem; font-weight:500; color:#64748b; background:none; border:0; border-radius:10px; cursor:pointer; text-decoration:underline; text-decoration-color:#cbd5e1; text-underline-offset:3px; }
.oc-restart:hover { color:#b91c1c; background:#fef2f2; text-decoration-color:currentColor; }

/* Soepel op gsm: geen tikvertraging, zichtbare tikfeedback, vensters scrollen de pagina niet mee */
a, button, summary, select, label, [role="button"], [role="tab"] { touch-action: manipulation; }
button:not(:disabled):active, summary:active, [role="button"]:active { filter: brightness(0.93); }
dialog, [role="dialog"], [role="alertdialog"], .modal, .modal-backdrop { overscroll-behavior: contain; }

/* Bewaar als bestand / Open bestand */
.menu [data-bestand] { min-height:44px; }
.menu .ocb-t { display:flex; flex-direction:column; min-width:0; white-space:normal; line-height:1.3; }
.menu .ocb-t small { font-size:0.8125rem; color:var(--slate-500, #64748b); margin-top:0.125rem; }
.menu .ocb-note { margin:0; padding:0.25rem 0.625rem 0.375rem; font-size:0.8125rem; line-height:1.35; color:var(--slate-500, #64748b); white-space:normal; }

/* Eenheid: startscherm zonder gegevens (Begin als hoofdknop, Voorbeeld bekijken rustig, Open bestand als link) */
.oc-start-btns { display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; margin-top:0.875rem; }
.oc-start-btns .oc-begin, .oc-start-btns .oc-vb { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0.5rem 1rem; border:0; border-radius:10px; font:inherit; font-weight:600; font-size:0.9375rem; line-height:1.3; cursor:pointer; text-align:center; }
.oc-start-btns .oc-begin { background:#047857; color:#fff; }
.oc-start-btns .oc-begin:hover { background:#065f46; }
.oc-start-btns .oc-vb { background:#f1f5f9; color:#334155; }
.oc-start-btns .oc-vb:hover { background:#e2e8f0; }
.oc-start-btns [hidden] { display:none !important; }
.oc-open-row { display:flex; justify-content:center; margin:0.5rem 0 0; }
.oc-open-row .oc-open-link { display:inline-flex; align-items:center; gap:0.5rem; min-height:44px; padding:0.5rem 1rem; border:0; background:none; border-radius:10px; font:inherit; font-size:0.875rem; font-weight:600; color:#047857; cursor:pointer; text-decoration:none; }
.oc-open-row .oc-open-link:hover { background:#ecfdf5; }
.oc-open-row .oc-open-link svg { width:18px; height:18px; flex:none; }
/* Safari op iPhone en iPad geeft een datumveld een eigen vaste breedte; zonder dit schuift het over het vak ernaast. */
input[type="date"] { -webkit-appearance:none; appearance:none; max-width:100%; min-width:0; font-variant-numeric:tabular-nums; }
input[type="date"]::-webkit-date-and-time-value { text-align:left; min-height:1.5em; }
input[type="date"]::-webkit-calendar-picker-indicator { cursor:pointer; opacity:0.6; }
</style>
</head>
<body>

<header class="header">
  <a href="https://onderconstructie.github.io/projectmanagement/#vergaderen" class="back-link" aria-label="Terug naar Vergaderen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Vergaderen

<script>
/* ---------- Overnemen tussen tools (gedeeld door de Onder Constructie-tools, v2) ----------
   Alle tools draaien op hetzelfde domein en delen dus localStorage. Elke tool legt wat hij te bieden
   heeft klaar onder 'oc.share.<tool-id>', in een vaste vorm, zodat andere tools het kunnen overnemen
   zonder elkaars binnenkant te kennen.

   Soorten (type):
     'betrokkene'  persoon, rol, stakeholder, doelgroep of team   { text, note? }
     'taak'        iets dat gedaan moet worden                     { text, note? }
     'actie'       taak met eigenaar en/of termijn                 { text, who?, when? }
     'risico'      risico met kans en impact                       { text, note? }
     'besluit'     beslissing (Beslissingslog)                     { text, note?, who?, when? }
     'doel'        wat er beter moet worden (Projectopdracht)      { text, note? }
                   Andere tools kiezen zelf welke soorten ze tonen (types in pick/count/sources) en slaan onbekende soorten dus over.
   'when' is bij voorkeur een datum als JJJJ-MM-DD; in "Overnemen uit…" staat die als 15 februari 2027.

   Gebruik:
     ocShare.publish('raci', 'RACI-matrix', [
       { name:'Heraanleg stadspark', items:[ { type:'betrokkene', text:'Projectleider' }, { type:'taak', text:'Budget goedkeuren' } ] }
     ]);                                   // aanroepen na elke bewaring
     ocShare.clear('raci');                // bij "Alles wissen"
     const gekozen = await ocShare.pick({ types:['betrokkene'], self:'weerstand', title:'Doelgroepen overnemen' });
     // geeft [] terug bij annuleren, anders de aangevinkte items (met .source, .bronId en .list erbij)
     // Afspraak: een tool geeft wat ze overnam (bronId) NIET opnieuw door, tenzij ze er een eigen oordeel aan toevoegde
     // (een score, een eigenaar, een datum). Zo blijft de bron de baas en komt wat daar verwijderd is niet terug.
     ocShare.pick({ ..., have:['Budget goedkeuren'] })  // optioneel: wat de tool al heeft, staat uitgegrijsd ("staat er al")
     ocShare.pick({ ..., vink:false })    // niets vooraf aanvinken;  notes:false  toont geen notities (voor wie alleen namen neemt)
     window.ocHave = types => [...]       // optioneel per tool: dan telt de knop "Overnemen uit andere tools" alleen wat nieuw is
   Dezelfde tekst van dezelfde soort uit meerdere tools tonen en tellen we één keer (tools geven overgenomen werk ook weer door).
   ?van=<tool> vinkt alleen die bron aan, en daarin de lijst van het actieve project als die er is.
*/
const ocShare = (() => {
  const PREFIX = 'oc.share.';
  const LABEL = { betrokkene:'betrokkenen', taak:'taken', actie:'acties', risico:"risico's", besluit:'besluiten', doel:'doelen' };
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  // Een datum als JJJJ-MM-DD tonen we zoals in de tools: 15 februari 2027. Andere tekst blijft zoals ze is.
  const datum = v => { const s = String(v || '').trim(), d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T12:00:00') : null;
    return d && !isNaN(d) ? d.toLocaleDateString('nl-BE', { day:'numeric', month:'long', year:'numeric' }) : s; };

  function publish(id, tool, lists) {
    try {
      const clean = (lists || []).map(l => ({
        name: String(l.name || '').slice(0, 80),
        items: (l.items || []).filter(i => i && i.type && String(i.text || '').trim())
          .slice(0, 300).map(i => ({ type:i.type, text:String(i.text).trim().slice(0, 300),
            note: i.note ? String(i.note).slice(0, 200) : undefined, who: typeof i.who === 'string' && i.who.trim() ? i.who.trim().slice(0, 120) : undefined,
            when: typeof i.when === 'string' && i.when.trim() ? i.when.trim().slice(0, 40) : undefined }))
      })).filter(l => l.items.length);
      if (!clean.length) { localStorage.removeItem(PREFIX + id); return; }
      localStorage.setItem(PREFIX + id, JSON.stringify({ id, tool, updated: Date.now(), lists: clean }));
    } catch {}
  }
  function clear(id) { try { localStorage.removeItem(PREFIX + id); } catch {} }

  // Elke bron apart: één kapotte sleutel mag de andere niet verbergen.
  function sources(types, self, voorkeur) {
    const out = [];
    let keys = [];
    try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch { return out; }
    keys.forEach(k => {
      if (!k || !k.startsWith(PREFIX) || k === PREFIX + self) return;
      try {
        const d = JSON.parse(localStorage.getItem(k));
        if (!d || !Array.isArray(d.lists)) return;
        d.lists.forEach(l => {
          if (!l || !Array.isArray(l.items)) return;
          const items = l.items.filter(it => it && types.includes(it.type) && typeof it.text === 'string' && it.text.trim())
            .map(it => ({ ...it, who: typeof it.who === 'string' ? it.who : undefined, when: typeof it.when === 'string' ? it.when : undefined }));
          if (items.length) out.push({ tool: String(d.tool || d.id || k.slice(PREFIX.length)), id: d.id, updated: +d.updated || 0, list: String(l.name || ''), items });
        });
      } catch {}
    });
    out.sort((a, b) => (b.updated || 0) - (a.updated || 0));
    // Elke tekst van elke soort één keer. Wie houdt hem? De bron uit ?van=, dan de rijkste (notitie, wie, wanneer),
    // dan de grootste lijst (meestal het origineel, niet een tool die het overnam), dan de recentste.
    // Mist de gekozen versie een wie of wanneer die een andere bron wel heeft, dan vullen we aan.
    const score = (s, it) => [s.id === voorkeur ? 1 : 0, (it.note ? 2 : 0) + (it.who ? 1 : 0) + (it.when ? 1 : 0), s.items.length, s.updated || 0];
    const beter = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; };
    const best = new Map();
    out.forEach(s => s.items.forEach(it => { const k = it.type + '|' + norm(it.text), sc = score(s, it), e = best.get(k); if (!e || beter(sc, e.sc)) best.set(k, { it, sc }); }));
    out.forEach(s => s.items.forEach(it => { const e = best.get(it.type + '|' + norm(it.text)).it; if (e !== it) { if (!e.who && it.who) e.who = it.who; if (!e.when && it.when) e.when = it.when; } }));
    return out.map(s => ({ ...s, items: s.items.filter(it => best.get(it.type + '|' + norm(it.text)).it === it) }))
      .filter(s => s.items.length);
  }
  // Vergelijken zonder hoofdletters, dubbele spaties of leestekens aan de rand
  function norm(v) { return String(v || '').normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim().replace(/^[\s.,;:!?·-]+|[\s.,;:!?·-]+$/g, ''); }

  let styled = false;
  function style() {
    if (styled) return; styled = true;
    const s = document.createElement('style');
    s.textContent = `
      .ocs-back{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45);
        backdrop-filter:blur(3px);opacity:0;transition:opacity .15s;font-family:'DM Sans',system-ui,sans-serif}
      @media(min-width:640px){.ocs-back{align-items:center;padding:1rem}}
      .ocs-back.open{opacity:1}
      .ocs{width:100%;max-width:520px;max-height:min(86vh,720px);display:flex;flex-direction:column;background:#fff;border-radius:18px 18px 0 0;
        box-shadow:0 20px 50px rgba(15,23,42,.25);transform:translateY(12px);transition:transform .15s;color:#1e293b}
      @media(min-width:640px){.ocs{border-radius:18px}}
      .ocs-back.open .ocs{transform:none}
      .ocs-head{padding:1.125rem 1.25rem .75rem;border-bottom:1px solid #e2e8f0}
      .ocs-title{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
      .ocs-sub{font-size:.8125rem;color:#64748b;margin-top:.125rem}
      .ocs-body{overflow:auto;padding:.5rem 1.25rem 1rem;flex:1}
      .ocs-src{margin-top:.875rem}
      .ocs-src-head{display:flex;align-items:center;gap:.5rem;padding:.375rem 0}
      .ocs-src-head b{font-size:.9375rem}
      .ocs-src-head span{font-size:.75rem;color:#64748b}
      .ocs-all{margin-left:auto;font:inherit;font-size:.8125rem;color:#047857;background:none;border:0;cursor:pointer;padding:.25rem .5rem;min-height:44px;border-radius:6px}
      .ocs-all:hover{background:#d1fae5}
      .ocs-item{display:flex;align-items:flex-start;gap:.625rem;padding:.625rem .25rem;min-height:44px;box-sizing:border-box;border-top:1px solid #f1f5f9;cursor:pointer;font-size:.9375rem;line-height:1.4;overflow-wrap:anywhere;min-width:0}
      .ocs-item.al{cursor:default;color:#64748b}.ocs-item.al em{font-style:normal;font-size:.75rem;font-weight:600;color:#047857;margin-left:.375rem;white-space:nowrap}
      .ocs-src-head b,.ocs-src-head span{overflow-wrap:anywhere;min-width:0}.ocs-note{margin:.25rem 0 .5rem;padding:.5rem .75rem;border-radius:10px;background:#f8fafc;color:#475569;font-size:.875rem;line-height:1.45}
      .ocs-item input{width:18px;height:18px;margin-top:.125rem;accent-color:#10b981;flex:none}
      .ocs-item small{display:block;font-size:.75rem;color:#64748b}
      .ocs-empty{padding:1.5rem .25rem;color:#64748b;font-size:.9375rem;line-height:1.5}
      .ocs-foot{display:flex;gap:.5rem;justify-content:flex-end;padding:.875rem 1.25rem calc(.875rem + env(safe-area-inset-bottom,0px));border-top:1px solid #e2e8f0}
      .ocs-btn{font:inherit;font-size:.9375rem;font-weight:600;padding:.625rem 1rem;min-height:44px;border-radius:10px;border:0;cursor:pointer}
      .ocs-cancel{background:#f1f5f9;color:#475569}
      .ocs-ok{background:#047857;color:#fff}.ocs-ok:hover{background:#065f46}
      .ocs-ok:disabled{background:#cbd5e1;color:#334155;cursor:default}
      .ocs-back :focus-visible{outline:2px solid #047857;outline-offset:2px}`;
    document.head.appendChild(s);
  }

  function pick({ types, self, title, intro, have, vink, notes }) {
    style();
    return new Promise(resolve => {
      let van = window.ocVan || ''; try { van = van || new URLSearchParams(location.search).get('van') || ''; } catch {}
      const src = sources(types, self, van), terug = document.activeElement;
      const heeft = new Set((have || []).map(norm));
      const vanNaam = van && !src.some(s => s.id === van) ? van : '';
      const back = document.createElement('div');
      back.className = 'ocs-back';
      const what = types.map(t => LABEL[t] || t).join(' of ');
      back.innerHTML = `<div class="ocs" role="dialog" aria-modal="true" aria-label="${esc(title || 'Overnemen')}">
        <div class="ocs-head"><div class="ocs-title">${esc(title || 'Overnemen uit een andere tool')}</div>
          <div class="ocs-sub">${esc(intro || `Kies welke ${what} je wil overnemen.`)}</div></div>
        <div class="ocs-body">${vanNaam ? `<p class="ocs-note">Uit die tool ligt nog niets klaar. Hieronder staat wat andere tools aanbieden.</p>` : ''}${src.length ? src.map((s, si) => `
          <div class="ocs-src"><div class="ocs-src-head"><b>${esc(s.tool)}</b><span>${esc(s.list)} · ${s.items.length}</span>
            <button class="ocs-all" type="button" data-all="${si}">alles</button></div>
            ${s.items.map((it, ii) => { const al = heeft.has(norm(it.text)); return `<label class="ocs-item${al ? ' al' : ''}"><input type="checkbox" data-s="${si}" data-i="${ii}"${al ? ' disabled' : ''}>
              <span>${esc(it.text)}${al ? '<em>staat er al</em>' : ''}${it.who || it.when || (notes !== false && it.note) ? `<small>${esc([it.who, datum(it.when), notes !== false && it.note].filter(Boolean).join(' · '))}</small>` : ''}</span></label>`; }).join('')}
          </div>`).join('') : `<p class="ocs-empty">Er zijn nog geen ${esc(what)} om over te nemen. Vul ze eerst in een andere tool van Onder Constructie in, dan verschijnen ze hier.</p>`}
        </div>
        <div class="ocs-foot"><button class="ocs-btn ocs-cancel" type="button">Annuleer</button>
          <button class="ocs-btn ocs-ok" type="button" disabled>Neem over</button></div></div>`;
      document.body.appendChild(back);
      requestAnimationFrame(() => back.classList.add('open'));
      const ok = back.querySelector('.ocs-ok');
      const boxes = () => [...back.querySelectorAll('input[type=checkbox]:not(:disabled)')];
      const sync = () => { const n = boxes().filter(b => b.checked).length; ok.disabled = !n; ok.textContent = n ? `Neem ${n} over` : 'Neem over'; };
      // Geopend vanuit een tool (?van=<tool>): alleen die bron aanvinken, en daarin de lijst van het actieve project als die er is.
      // Zonder ?van= en met één bron: die staat aangevinkt.
      let proj = ''; try { proj = norm((JSON.parse(localStorage.getItem('oc.project') || 'null') || {}).name); } catch {}
      const vanSrc = van ? src.filter(s => s.id === van) : [];
      const vanProj = proj ? vanSrc.filter(s => norm(s.list) === proj) : [];
      // Alleen vanuit een link (?van=) staat iets vooraf aangevinkt. Anders kies je zelf (of tik op "alles"):
      // één tik op het punt dat je wil, mag nooit de rest overnemen.
      const aan = vink === false || !van ? [] : (vanProj.length ? vanProj : vanSrc);
      boxes().forEach(b => { if (aan.includes(src[+b.dataset.s])) b.checked = true; }); sync();
      back.addEventListener('change', sync);
      back.addEventListener('click', e => {
        const a = e.target.closest('[data-all]');
        if (a) { const bs = boxes().filter(b => b.dataset.s === a.dataset.all); const all = bs.every(b => b.checked); bs.forEach(b => b.checked = !all); sync(); }
        if (e.target === back) close([]);
      });
      function close(v) { document.removeEventListener('keydown', onKey, true); back.remove(); try { if (terug && terug.isConnected) terug.focus({ preventScroll:true }); } catch {} resolve(v); }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close([]); return; }
        if (e.key !== 'Tab') return;   // de focus blijft in de kiezer
        const f = [...back.querySelectorAll('input:not(:disabled),button:not(:disabled)')].filter(x => x.offsetParent !== null);
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && (i === f.length - 1 || i < 0)) { e.preventDefault(); f[0].focus(); }
      }
      document.addEventListener('keydown', onKey, true);
      back.querySelector('.ocs-cancel').addEventListener('click', () => close([]));
      ok.addEventListener('click', () => close(boxes().filter(b => b.checked).map(b => {
        const s = src[+b.dataset.s]; return { ...s.items[+b.dataset.i], source: s.tool, bronId: s.id, list: s.list };
      })));
      const first = back.querySelector('input:not(:disabled),.ocs-cancel'); first && first.focus();
    });
  }

  // Hoeveel er klaarligt voor deze soorten (om een knop te tonen of een teller te zetten).
  const count = (types, self) => sources(types, self).reduce((n, s) => n + s.items.length, 0);
  return { publish, clear, pick, count, sources, esc };
})();

/* Herkomst: een item dat je overnam (van = de tool waar het vandaan komt) geeft Vinkje alleen door als jij hier
   een eigenaar of datum gaf die niet uit de bron kwam (vanWas). Afvinken of verwijderen doe je in de bron zelf:
   zo blijft de bron de baas. Pas je de tekst aan, dan is het je eigen item. Oude items zonder herkomst gelden als eigen werk. */
const ocWieWanneer = i => (i.who || '') + '|' + (i.when || '');
const ocEigen = i => !i.van || (ocWieWanneer(i) !== (i.vanWas || '') && !!(i.who || i.when));
function ocPublish() {
  // Komma's tussen namen ("Fatima, Pieter") worden "; ": zo maakt het Takenbord er aparte mensen van. Het veld zelf blijft zoals je het typte.
  function ocWie(w) { return typeof w === 'string' && w.trim() ? w.split(/\s*[,;]\s*/).map(x => x.trim()).filter(Boolean).join('; ') || undefined : undefined; }
  ocShare.publish(OC_ID, OC_TOOL, state.lists.filter(l => !l.voorbeeld).map(l => ({ name:l.name, items:l.items.filter(i => !i.done && ocEigen(i)).map(i => (i.who || i.when) ? ({ type:'actie', text:i.text, who:ocWie(i.who), when:i.when || undefined }) : ({ type:'taak', text:i.text })) })));
}

async function ocWipeAll() {
  if (!await ocConfirm(`Alles wissen in ${OC_TOOL}?`, 'Alle lijsten verdwijnen. Je kan dit nog ongedaan maken tot je iets anders doet.', 'Alles wissen')) return;
  const copy = JSON.parse(JSON.stringify(state));
  try { localStorage.removeItem(KEY); } catch {}
  state = load(); save(); render();
  ocShare.clear(OC_ID);
  toast('Alles gewist', ocUndoable(() => { state = copy; }));
}

// Vergelijken zoals de kiezer: zonder hoofdletters, dubbele spaties of leestekens aan de rand.
const ocNorm = v => String(v || '').normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim().replace(/^[\s.,;:!?·-]+|[\s.,;:!?·-]+$/g, '');
// Wat deze lijst al heeft: de kiezer grijst het uit, en de knop telt het niet als nieuw
const ocAlItems = () => cur().items.map(i => i.text);
window.ocHave = types => { try { return types.some(t => t === 'taak' || t === 'actie') ? ocAlItems() : []; } catch { return []; } };
document.addEventListener('click', async e => {
  if (!e.target.closest('#oc-imp')) return;
  const types = ['taak', 'actie'];
  const picked = await ocShare.pick({ types, self:OC_ID, title:'Overnemen in je checklist', intro:'Kies taken of acties uit andere tools. Ze komen onderaan je lijst.', have:ocAlItems() });
  if (!picked.length) return;
  const l = cur(), have = new Set(l.items.map(i => ocNorm(i.text))), restore = snapshot();
  // Hoeveel van wat klaarlag, stond al in deze lijst (de kiezer toonde die uitgegrijsd)
  let al = 0; try { al = ocShare.sources(types, OC_ID).reduce((n, src) => n + src.items.filter(it => have.has(ocNorm(it.text))).length, 0); } catch {}
  let n = 0;
  picked.forEach(p => {
    const text = String(p.text || '').replace(/\s+/g, ' ').trim().slice(0, 500), k = ocNorm(text);
    if (!text) return;
    if (have.has(k)) return; have.add(k);
    const it = { id:uid(), text, done:false };
    const who = cleanWho(p.who), when = cleanWhen(p.when);
    if (who) it.who = who;
    if (when) it.when = when;
    if (typeof p.bronId === 'string' && p.bronId) { it.van = p.bronId.slice(0, 40); it.vanWas = ocWieWanneer(it); }   // herkomst
    if (it.who || it.when) l.fields = true;
    l.items.push(it); n++;

  if (n) adoptProject(l);
  save(); render();
  const nieuw = n ? `${n} ${n === 1 ? 'item' : 'items'} overgenomen` : 'Niets nieuws overgenomen';
  toast(al ? `${nieuw}. ${al} ${al === 1 ? 'stond' : 'stonden'} er al.` : nieuw, n ? restore : undefined);

/* ---------- Download als afbeelding of PDF (gedeeld door de Onder Constructie-tools, v3) ----------
   Gebruik:
     ocExport.png(bouwFn, 'bestandsnaam', { landscape:true })
     ocExport.pdf(bouwFn, 'bestandsnaam', { landscape:true })
   bouwFn() geeft { node, title, subtitle } terug: een DOM-knoop met inline styles, zonder knoppen of invoervelden.
   Die komt buiten beeld op een witte pagina met kop (titel, ondertitel, datum) en voet.
   Zet data-oc-keep op blokken die in een PDF niet over twee pagina's gesplitst mogen worden
   (een beslissing, een kaartje, een rij); ze schuiven dan door naar de volgende pagina.
   Een browser tekent geen canvas boven een maximale grootte (Chrome: 65.535 px hoog of breed; iPad en iPhone:
   ongeveer 16 miljoen pixels). Daarboven wordt de PDF of afbeelding zwart of leeg. Daarom tekent de PDF
   telkens een paar hele pagina's tegelijk, op volle scherpte, en wordt een heel lange afbeelding net zo
   scherp getekend als binnen die grens kan.
   html2canvas en jsPDF worden pas geladen bij de eerste download, van dezelfde adressen als de
   andere tools, zodat de app ze offline kan bewaren. */
const ocExport = (() => {
  const LIBS = {
    h2c: '/lib/html2canvas-1.4.1.min.js',
    pdf: '/lib/jspdf-2.5.1.umd.min.js'
  };
  const A4 = { w: 210, h: 297 }, MARGIN = 10;   // mm
  // Grenzen van een canvas: iPad en iPhone ongeveer 16 miljoen pixels; Chrome en Edge tot 65.535 px hoog of breed; andere browsers 32.767 px.
  const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const CHROME = !IOS && /Chrome\//.test(navigator.userAgent);
  const SCALE = 2, MAX_SIDE = CHROME ? 65000 : 32000, MAX_AREA = IOS ? 16e6 : 120e6;   // scherpte; langste zijde en oppervlakte in pixels
  // Grootste schaal (tot SCALE) waarbij een canvas van w × h CSS-pixels nog getekend wordt.
  const fit = (w, h, area = MAX_AREA) => Math.floor(Math.min(SCALE, Math.sqrt(area / (w * h)), MAX_SIDE / h, MAX_SIDE / w) * 100) / 100;
  const loaded = {};
  function load(url) {
    if (!loaded[url]) loaded[url] = new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = url; s.onload = ok; s.onerror = () => { delete loaded[url]; fail(new Error('laden mislukt')); };
      document.head.appendChild(s);
    });
    return loaded[url];
  }
  const today = () => new Date().toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' });
  function page(content, { title, subtitle, width }) {
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:fixed;left:-20000px;top:0;width:${width}px;background:#fff;padding:36px 40px 28px;
      font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:#1e293b;-webkit-font-smoothing:antialiased;box-sizing:border-box;`;
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid #10b981;padding-bottom:12px;margin-bottom:20px;';
    head.innerHTML = `<div><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#1e293b"></div>
      <div style="font-size:14px;color:#64748b;margin-top:2px"></div></div>
      <div style="font-size:12px;color:#94a3b8;white-space:nowrap">${today()}</div>`;
    head.children[0].children[0].textContent = title || '';
    head.children[0].children[1].textContent = subtitle || '';
    const foot = document.createElement('div');
    foot.style.cssText = 'margin-top:22px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;';
    foot.innerHTML = '<span>Onder Constructie</span><span>onderconstructie.github.io</span>';
    wrap.append(head, content, foot);
    document.body.appendChild(wrap);
    return wrap;
  }
  // Schuift blokken met data-oc-keep die over een paginagrens zouden vallen naar de volgende pagina.
  function keepTogether(wrap, pageH) {
    const top0 = () => wrap.getBoundingClientRect().top;
    for (const el of wrap.querySelectorAll('[data-oc-keep]')) {
      const r = el.getBoundingClientRect(), t = r.top - top0(), b = t + r.height;
      if (r.height > pageH * 0.85) continue;            // te groot om heel te houden
      const boundary = Math.ceil(t / pageH) * pageH;     // eerstvolgende grens na de bovenkant
      if (t % pageH !== 0 && b > boundary && t < boundary) {
        const gap = document.createElement('div');
        gap.style.cssText = `height:${boundary - t + 6}px;`;
        el.parentNode.insertBefore(gap, el);
      }
    }
  }
  // Zet de exportpagina buiten beeld, wacht op de lettertypes en geeft ze aan fn; ruimt daarna op.
  async function withPage(build, width, fn) {
    const built = build();
    const node = page(built.node, { title: built.title, subtitle: built.subtitle, width });
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      return await fn(node);
    } finally { node.remove(); }
  }
  const heightOf = node => Math.ceil(node.getBoundingClientRect().height);
  // Alleen de exportpagina gaat mee in de kopie die html2canvas maakt: de rest van de tool overslaan scheelt veel tijd.
  const draw = (node, o) => window.html2canvas(node, Object.assign({ scale: SCALE, backgroundColor: '#ffffff', logging: false, useCORS: true,
    ignoreElements: el => el.parentNode === document.body && el !== node && !/^(STYLE|LINK)$/.test(el.tagName) }, o));
  const free = c => { c.width = c.height = 0; };     // geheugen meteen vrijgeven (iPad)
  function save(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  const widthFor = opts => opts.width || (opts.landscape ? 1120 : 800);
  async function png(build, name, opts = {}) {
    const width = widthFor(opts);
    await load(LIBS.h2c);
    const c = await withPage(build, width, node => draw(node, { scale: fit(width, heightOf(node)) }));
    await new Promise(ok => c.toBlob(b => { save(b, name + '.png'); free(c); ok(); }, 'image/png'));
  }
  async function pdf(build, name, opts = {}) {
    const landscape = !!opts.landscape, width = widthFor(opts);
    const pw = landscape ? A4.h : A4.w, ph = landscape ? A4.w : A4.h, w = pw - 2 * MARGIN;
    const pageCss = (ph - 2 * MARGIN) / w * width;       // paginahoogte in CSS-pixels van de exportknoop
    await Promise.all([load(LIBS.h2c), load(LIBS.pdf)]);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: landscape ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
    await withPage(build, width, async node => {
      const H0 = heightOf(node);
      // Net te hoog voor één pagina (bv. alleen de voettekst): verkleinen tot het past, geen lege tweede pagina.
      if (H0 > pageCss && H0 <= pageCss * 1.2) {
        const c = await draw(node, { scale: fit(width, H0) }), ww = w * pageCss / H0;
        doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', MARGIN + (w - ww) / 2, MARGIN, ww, ph - 2 * MARGIN);
        free(c); return;
      }
      keepTogether(node, pageCss);
      const H = heightOf(node), s = fit(width, pageCss), pagePx = pageCss * s;
      const n = Math.max(1, Math.ceil((H - 1) / pageCss));                       // aantal pagina's
      const per = Math.max(1, Math.floor(Math.min(MAX_AREA / (width * s * pagePx), MAX_SIDE / pagePx)));   // pagina's per stuk
      for (let i = 0; i < n; i += per) {
        const y = i * pageCss, k = Math.min(per, n - i);
        const c = await draw(node, { scale: s, y, height: Math.ceil(Math.min(k * pageCss, H - y)) });
        for (let j = 0; j < k; j++) {
          const top = Math.round(j * pagePx), h = Math.min(Math.round((j + 1) * pagePx), c.height) - top;
          if (h < 1) break;
          const part = document.createElement('canvas'); part.width = c.width; part.height = h;
          part.getContext('2d').drawImage(c, 0, top, c.width, h, 0, 0, c.width, h);
          if (i + j) doc.addPage();
          doc.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', MARGIN, MARGIN, w, h * w / c.width);
          free(part);
        }
        free(c);
      }
    });
    save(doc.output('blob'), name + '.pdf');
  }
  return { png, pdf };
})();

/* ---------- Opslag ---------- */
const KEY = 'vinkje.v1';
const uid = () => Math.random().toString(36).slice(2, 10);
/* Wie en wanneer komen soms in een andere vorm binnen: uit andere tools, een gedeelde link of oude bewaringen.
   Wie wordt altijd tekst (een object geeft zijn naam, een lijst wordt "An, Jonas").
   Wanneer wordt een datum JJJJ-MM-DD; we lezen ook 20/11/2026, 20-11-2026, 20.11.2026 en 20 november 2026.
   Wat geen geldige datum is, valt weg. */
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function cleanWho(v, diepte = 0) {
  if (diepte > 2) return '';
  if (Array.isArray(v)) v = v.map(x => cleanWho(x, diepte + 1)).filter(Boolean).join(', ');
  else if (v && typeof v === 'object') v = cleanWho(v.name ?? v.naam ?? v.text ?? '', diepte + 1);
  else if (typeof v === 'number' && isFinite(v)) v = String(v);
  return typeof v === 'string' ? v.replace(/\s+/g, ' ').trim().slice(0, 80) : '';
}
function cleanWhen(v, diepte = 0) {
  if (Array.isArray(v)) { if (diepte > 2) return ''; for (const x of v) { const d = cleanWhen(x, diepte + 1); if (d) return d; } return ''; }
  if (typeof v !== 'string') return '';
  const s = v.trim().toLowerCase();
  let y, m, d, x;
  if ((x = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:$|[t\s])/))) [, y, m, d] = x;
  else if ((x = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) [, d, m, y] = x;
  else if ((x = s.match(/^(\d{1,2})\s+([a-z]+)\.?\s+(\d{4})$/))) {
    const i = x[2] === 'mrt' ? 2 : MAANDEN.findIndex(n => n === x[2] || (x[2].length >= 3 && n.startsWith(x[2])));
    if (i < 0) return '';
    [d, m, y] = [x[1], i + 1, x[3]];
  } else return '';
  const t = new Date(+y, +m - 1, +d);
  if (t.getFullYear() !== +y || t.getMonth() !== +m - 1 || t.getDate() !== +d) return '';
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.lists)) {
      // Kapotte lijsten of items overslaan in plaats van de pagina te laten vastlopen
      const lists = d.lists.filter(l => l && typeof l === 'object').map(l => Object.assign({}, l, {
        id: typeof l.id === 'string' && l.id ? l.id : uid(),
        name: (typeof l.name === 'string' || typeof l.name === 'number') ? String(l.name).slice(0, 60) : 'Naamloos',
        items: (Array.isArray(l.items) ? l.items : []).filter(i => i && typeof i === 'object' && typeof i.text === 'string' && i.text.trim()).map(i => {
          const it = Object.assign({}, i, { id: typeof i.id === 'string' && i.id ? i.id : uid(), text: i.text.slice(0, 500), done: !!i.done });
          const who = cleanWho(it.who), when = cleanWhen(it.when);
          if (who) it.who = who; else delete it.who;
          if (when) it.when = when; else delete it.when;
          if (typeof it.van === 'string' && it.van) it.vanWas = typeof it.vanWas === 'string' ? it.vanWas : ''; else { delete it.van; delete it.vanWas; }
          return it;

    .map((text, i) => ({ id:uid(), text, done:i < 2 }));
  // Twee items met wie en tegen wanneer, zodat je ziet wat dat geeft.
  const over = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  Object.assign(items[3], { who:'Onthaal', when:over(2) }); Object.assign(items[4], { who:'Projectleider', when:over(7) });

});

  state.lists = state.lists.filter(x => !x.voorbeeld);
  if (!state.lists.length) state.lists.push({ id:uid(), name:ocProject('Mijn lijst').slice(0, 60), items:[] });

function buildExport(l) {
  const open = l.items.filter(i => !i.done), done = l.items.filter(i => i.done);
  const node = document.createElement('div');
  const row = (it, isDone) => {
    const r = document.createElement('div');
    r.style.cssText = 'display:flex;align-items:flex-start;gap:14px;padding:11px 4px;border-bottom:1px solid #f1f5f9;';
    r.dataset.ocKeep = '';
    const box = document.createElement('div');
    box.style.cssText = isDone
      ? 'flex:none;width:20px;height:20px;margin-top:2px;border-radius:6px;background:#10b981;display:flex;align-items:center;justify-content:center;'
      : 'flex:none;width:20px;height:20px;margin-top:2px;border-radius:6px;border:2px solid #94a3b8;box-sizing:border-box;';
    if (isDone) box.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const t = document.createElement('div');
    t.textContent = it.text;
    const m = metaText(it);
    if (m) { const sm = document.createElement('div'); sm.textContent = m; sm.style.cssText = 'font-size:13px;color:#64748b;text-decoration:none;margin-top:1px;'; t.appendChild(sm); }
    t.style.cssText = isDone
      ? 'font-size:16px;line-height:1.5;color:#94a3b8;text-decoration:line-through;text-decoration-color:#cbd5e1;word-break:break-word;'
      : 'font-size:16px;line-height:1.5;color:#1e293b;word-break:break-word;';
    r.append(box, t);
    return r;
  };
  const label = text => {
    const h = document.createElement('div');
    h.textContent = text;
    h.style.cssText = 'font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#94a3b8;margin:4px 0 4px 4px;';
    return h;
  };
  if (open.length) { node.append(label(`Te doen (${open.length})`)); open.forEach(i => node.append(row(i, false))); }
  if (done.length) {
    const h = label(`Afgevinkt (${done.length})`); if (open.length) h.style.marginTop = '26px';
    node.append(h); done.forEach(i => node.append(row(i, true)));
  }
  return { node, title: 'Vinkje', subtitle: `${l.name || 'Naamloos'} · ${done.length} van ${l.items.length} gedaan` };
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); return ok;
  } catch { return false; }
}

/* ---------- Delen via link: de lijst zit in de URL, er gaat niets naar een server ---------- */
function encode(l) {
  const data = JSON.stringify({ n:l.name, i:l.items.map(i => (i.who || i.when) ? [i.text, i.done ? 1 : 0, i.who || '', i.when || ''] : i.done ? [i.text, 1] : [i.text]) });
  const bytes = new TextEncoder().encode(data);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decode(s) {
  try {
    const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (!d || !Array.isArray(d.i)) return null;
    return { name:String(d.n || 'Gedeelde lijst').slice(0, 60),
             items:d.i.slice(0, 500).map(x => { const it = { id:uid(), text:String(x[0] || '').slice(0, 500), done:!!x[1] };
               const who = cleanWho(x[2]), when = cleanWhen(x[3]); if (who) it.who = who; if (when) it.when = when; return it; }).filter(x => x.text) };
  } catch { return null; }
}
async function shareList(l) {
  if (!l.items.length) { toast('De lijst is nog leeg'); return; }
  const url = 'https://onderconstructie.github.io/vinkje/#l=' + encode(l);
  if (navigator.share && matchMedia('(pointer:coarse)').matches) {
    try { await navigator.share({ title:l.name, text:`Checklist: ${l.name}`, url }); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  await copy(url) ? toast('Link gekopieerd') : toast('Kopiëren lukt hier niet');
}
let pending = null;
function checkImport() {
  const m = location.hash.match(/^#l=([A-Za-z0-9_-]+)/);
  if (!m) return;
  pending = decode(m[1]);
  history.replaceState(null, '', location.pathname + location.search);
  if (!pending || !pending.items.length) { pending = null; return; }
  $('import-name').textContent = pending.name;
  $('import-count').textContent = pending.items.length + (pending.items.length === 1 ? ' item' : ' items');
  $('import').hidden = false;
}
$('import-yes').addEventListener('click', () => {
  if (pending) newList(pending.name, pending.items);
  pending = null; $('import').hidden = true; toast('Lijst bewaard');
});
$('import-no').addEventListener('click', () => { pending = null; $('import').hidden = true; });

/* ---------- Andere tabbladen houden we gelijk ---------- */
window.addEventListener('storage', e => { if (e.key === KEY) { state = load(); render(); } });

checkImport();
render();

<script>
/* Opnieuw beginnen: zichtbaar zodra er echt iets ingevuld is; start de eigen 'Alles wissen' van de tool.
   'Leeg' = wat de tool zelf bewaart zonder inbreng van de gebruiker (na een eerste bezoek of na wissen). */
(() => {
  const meta = document.querySelector('meta[name="oc:opslag"]');
  const keys = meta ? meta.content.split(',').map(s => s.trim()).filter(k => k && !k.startsWith('oc.share.') && !k.endsWith('*')) : [];
  const BASE = 'oc.leeg.' + location.pathname;   // niet onder oc-app.*: dat wist het gegevensscherm apart
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const vals = () => Object.fromEntries(keys.map(k => [k, get(k)]));
  const has = v => Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.values(v).some(has) : typeof v === 'string' && v.trim().length > 0;
  const content = raw => { try { return has(JSON.parse(raw)); } catch { return !!raw; } };
  let base = null; try { base = JSON.parse(get(BASE) || 'null'); } catch {}
  const setBase = () => { base = vals(); try { localStorage.setItem(BASE, JSON.stringify(base)); } catch {} sync(); };
  const filled = () => { const v = vals(); return keys.some(k => v[k] != null && content(v[k]) && !(base && v[k] === base[k])); };
  const row = document.getElementById('oc-restart-row');
  function sync() { row.hidden = !filled() || !document.querySelector('[data-act="wipe"]'); }
  let t; const later = () => { clearTimeout(t); t = setTimeout(sync, 350); };
  ['click', 'input', 'change', 'keyup'].forEach(ev => document.addEventListener(ev, later, true));
  window.addEventListener('storage', later); window.addEventListener('focus', later);
  // Eerste bezoek: wat de tool zelf meteen bewaart, telt als leeg. Een tool die nog niets klaarlegde
  // voor andere tools (oc.share.*), heeft nog geen echte inhoud.
  const share = meta ? meta.content.split(',').map(s => s.trim()).find(k => k.startsWith('oc.share.')) : null;
  if (!base && share && get(share) == null) setBase();
  else if (keys.every(k => get(k) == null)) setTimeout(setBase, 900);
  // Na wissen (via deze knop of het menu): de nieuwe toestand is de lege toestand.
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-act="wipe"]')) return;
    const before = JSON.stringify(vals()); let n = 0;
    const iv = setInterval(() => {
      if (++n > 40) return clearInterval(iv);
      if (document.querySelector('.ocw-back')) return;               // bevestiging staat nog open
      if (JSON.stringify(vals()) !== before) { clearInterval(iv); setTimeout(setBase, 400); }
      else if (n > 5) clearInterval(iv);                              // geannuleerd
    }, 150);
  }, true);
  document.getElementById('oc-restart-btn').addEventListener('click', () => { const w = document.querySelector('[data-act="wipe"]'); w && w.click(); });
  sync();
})();
</script>

<script>
/* oc-bestand: je werk in deze tool bewaren als bestand en later (of op een ander toestel) weer openen.
   Formaat = dat van de reservekopie in de app: { app:'Onder Constructie', version:1, created, tool, data:{ sleutel: tekst } }.
   Een reservekopie uit de app kan je hier ook openen: de tool neemt er alleen zijn eigen deel uit. */
window.ocBestand = (function () {
  function patronen() {
    var m = document.querySelector('meta[name="oc:opslag"]');
    return m ? m.content.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : [];
  }
  function past(k, p) { return p.slice(-1) === '*' ? k.indexOf(p.slice(0, -1)) === 0 : k === p; }
  function eigen(k) { return patronen().some(function (p) { return past(k, p); }); }
  function sleutels() {
    var uit = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && eigen(k)) uit.push(k); } } catch (e) {}
    return uit;
  }
  function naam() {
    var m = document.querySelector('meta[name="oc:titel"]') || document.querySelector('meta[name="application-name"]');
    return (m && m.content) || (document.title.split(/\s[–-]\s/)[0] || 'tool').trim();
  }
  function slug(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  /* bewaar(): downloadt het bestand. Geeft het aantal bewaarde sleutels terug (0 = niets om te bewaren). */
  function bewaar(extraNaam) {
    var keys = sleutels(); if (!keys.length) return 0;
    var data = {}; keys.forEach(function (k) { try { data[k] = localStorage.getItem(k); } catch (e) {} });
    var id = location.pathname.replace(/\/index\.html$/, '').split('/').filter(Boolean).pop() || 'tool';
    var blob = new Blob([JSON.stringify({ app: 'Onder Constructie', version: 1, created: new Date().toISOString(), tool: id, data: data }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    var stuk = slug(naam()) + (extraNaam ? '-' + slug(extraNaam) : '');
    a.download = stuk + '-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    return keys.length;
  }
  /* lees(file): Promise met { data: {sleutel: tekst} } van alleen de eigen sleutels.
     Fout 'vorm' = geen bestand van Onder Constructie; fout 'leeg' = niets van deze tool in het bestand. */
  function lees(file) {
    return file.text().then(function (t) {
      var d; try { d = JSON.parse(t); } catch (e) { throw new Error('vorm'); }
      if (!d || d.app !== 'Onder Constructie' || typeof d.data !== 'object' || !d.data) throw new Error('vorm');
      var uit = {}, n = 0;
      Object.keys(d.data).forEach(function (k) { if (eigen(k) && typeof d.data[k] === 'string') { uit[k] = d.data[k]; n++; } });
      if (!n) throw new Error('leeg');
      return { data: uit, aantal: n, created: d.created || null };
    });
  }
  /* zetTerug(gelezen): vervangt het huidige werk van deze tool door wat in het bestand staat, en laat andere tabbladen herladen. */
  function zetTerug(g) {
    sleutels().forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    Object.keys(g.data).forEach(function (k) { try { localStorage.setItem(k, g.data[k]); } catch (e) {} });
  }
  function melding(err) {
    return err && err.message === 'leeg' ? 'In dit bestand staat niets van ' + naam() + '.'
      : 'Dit bestand kan ik niet openen. Kies een bestand dat je met "Bewaar als bestand" of als reservekopie maakte.';
  }
  return { bewaar: bewaar, lees: lees, zetTerug: zetTerug, melding: melding, sleutels: sleutels, naam: naam };
})();
</script>
<script>
/* Bewaar als bestand / Open bestand */
(() => {
  const heeftWerk = () => { try { return !document.getElementById('oc-restart-row').hidden; } catch (e) { return true; } };
  const extraNaam = () => { try { return String((L => Array.isArray(L) && L.length === 1 ? L[0].name : '')(state.lists) || '').trim(); } catch (e) { return ''; } };
  const inp = document.getElementById('oc-bestand-in');
  // Een lange melding blijft langer staan (minstens 4,5 s): toon ze opnieuw voor ze verdwijnt.
  const lang = msg => { toast(msg); setTimeout(() => { const t = document.getElementById('toast-text'); if (t && t.textContent === msg) toast(msg); }, 2300); };
  const sluit = () => { const m = document.getElementById('menu'), b = document.getElementById('menu-btn'); if (m) m.classList.remove('open'); if (b) b.setAttribute('aria-expanded', 'false'); };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-bestand]'); if (!b) return;
    sluit();
    if (b.dataset.bestand === 'bewaar') {
      if (!heeftWerk() || !ocBestand.bewaar(extraNaam())) { toast('Er is nog niets om te bewaren.'); return; }
      toast('Bestand gedownload');
    } else { inp.value = ''; inp.click(); }
  });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let g; try { g = await ocBestand.lees(f); } catch (err) { lang(ocBestand.melding(err)); return; }
    if (heeftWerk() && !await ocConfirm('Bestand openen?', 'Dit vervangt wat nu in ' + ocBestand.naam() + ' staat. Doorgaan?', 'Vervang')) return;
    // Tot de herlaadbeurt mag niets het teruggezette werk nog overschrijven (uitgestelde bewaring, pagehide, ander tabblad).
    const pat = (document.querySelector('meta[name="oc:opslag"]') || {}).content || '';
    const eigen = k => pat.split(',').map(s => s.trim()).filter(Boolean).some(p => p.slice(-1) === '*' ? String(k).indexOf(p.slice(0, -1)) === 0 : k === p);
    ocBestand.zetTerug(g);
    try {
      const set = Storage.prototype.setItem, rem = Storage.prototype.removeItem;
      Storage.prototype.setItem = function (k, v) { if (this === localStorage && eigen(k)) return; return set.call(this, k, v); };
      Storage.prototype.removeItem = function (k) { if (this === localStorage && eigen(k)) return; return rem.call(this, k); };
    } catch (e) {}
    location.reload();
  });
})();
