<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="description" content="Een slanke checklist. Plak een lijst, vink af, zet terug, deel met een link.">
    <meta name="oc:groep" content="projecten">

    <meta name="oc:kort" content="Een lijstje om af te vinken en te hergebruiken">

<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80' fill='none'%3E%3Ccircle cx='40' cy='40' r='36' fill='%23f8fafc' stroke='%23e2e8f0' stroke-width='2'/%3E%3Crect x='22' y='22' width='12' height='12' rx='3.5' fill='%2310b981'/%3E%3Cpath d='M25 28.2l2 2 4-4.4' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='39' y='26' width='20' height='4' rx='2' fill='%23cbd5e1'/%3E%3Crect x='22' y='40' width='12' height='12' rx='3.5' fill='%2310b981'/%3E%3Cpath d='M25 46.2l2 2 4-4.4' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='39' y='44' width='16' height='4' rx='2' fill='%23cbd5e1'/%3E%3Crect x='23' y='59' width='10' height='10' rx='3' stroke='%23cbd5e1' stroke-width='2'/%3E%3Crect x='39' y='62' width='18' height='4' rx='2' fill='%23e2e8f0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root {
  --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1; --slate-200:#e2e8f0;
  --slate-100:#f1f5f9; --slate-50:#f8fafc; --wit:#ffffff;
  --accent:#10b981; --accent-dark:#047857; --accent-hover:#065f46; --accent-light:#d1fae5; --accent-50:#ecfdf5;
  --rood:#ef4444;
  --bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:'DM Sans', system-ui, sans-serif; background:var(--slate-50); color:var(--slate-700);
  line-height:1.5; min-height:100vh; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
button, input { font:inherit; color:inherit; }
button { background:none; border:0; cursor:pointer; }
[hidden] { display:none !important; }

/* Kop */
.header { background:var(--wit); border-bottom:1px solid var(--slate-200); padding:1.5rem 1.25rem 1.75rem; position:relative; text-align:center; }
.back-link {
  position:absolute; top:1.25rem; left:1.25rem; display:inline-flex; align-items:center; gap:0.5rem;
  font-size:0.875rem; color:var(--slate-500); text-decoration:none; transition:color 0.2s;
}
.back-link:hover { color:var(--accent-dark); }
.back-link svg { width:16px; height:16px; }
.logo svg { width:56px; height:56px; }
.title { font-size:1.625rem; font-weight:700; color:var(--slate-800); letter-spacing:-0.03em; line-height:1.2; margin-top:0.5rem; }
.subtitle { font-size:0.9375rem; color:var(--slate-500); }

.main { flex:1; width:100%; max-width:640px; margin:0 auto; padding:1.25rem 1rem 3rem; }

/* Lijstkeuze */
.lists { display:flex; gap:0.5rem; overflow-x:auto; scrollbar-width:none; margin:0 -1rem 1rem; padding:0.125rem 1rem; }
.lists::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; padding:0.4375rem 0.875rem; border-radius:999px; font-size:0.875rem; font-weight:600;
  border:1px solid var(--slate-200); background:var(--wit); color:var(--slate-600); white-space:nowrap;
  display:flex; align-items:center; gap:0.375rem;
}
.tab .n { font-size:0.75rem; font-weight:500; color:var(--slate-500); font-variant-numeric:tabular-nums; }
.tab.active { background:var(--slate-800); border-color:var(--slate-800); color:var(--wit); }
.tab.active .n { color:var(--slate-300); }
.tab.add { color:var(--accent-dark); border-style:dashed; }

/* Kaart */
.card { background:var(--wit); border:1px solid var(--slate-200); border-radius:16px; box-shadow:0 1px 2px rgba(15,23,42,0.04); overflow:hidden; }
.card-head { display:flex; align-items:center; gap:0.5rem; padding:1rem 0.75rem 0.75rem 1.125rem; }
.list-name {
  flex:1; min-width:0; font-size:1.25rem; font-weight:700; color:var(--slate-800); letter-spacing:-0.02em;
  border:0; background:none; outline:none; padding:0.125rem 0; border-bottom:1.5px solid transparent;
}
.list-name:focus, .list-name:focus-visible { border-bottom-color:var(--accent);  }
.icon-btn { width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--slate-500); flex-shrink:0; }
.icon-btn:hover { background:var(--slate-100); color:var(--slate-700); }
.icon-btn svg { width:20px; height:20px; }
.icon-btn.icon-del:hover { background:#fef2f2; color:#b91c1c; }

.progress { padding:0 1.125rem 0.875rem; }
.progress-text { display:flex; justify-content:space-between; font-size:0.8125rem; color:var(--slate-500); margin-bottom:0.375rem; font-variant-numeric:tabular-nums; }
.progress-text strong { color:var(--slate-700); font-weight:600; }
.bar { height:6px; background:var(--slate-100); border-radius:99px; overflow:hidden; }
.bar span { display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width 0.3s ease; }
.card.all-done .progress-text strong { color:var(--accent-dark); }

/* Invoer */
.add-row { display:flex; gap:0.5rem; padding:0 0.75rem 0.75rem 0.75rem; }
.add-input {
  flex:1; min-width:0; padding:0.6875rem 0.875rem; border:1.5px solid var(--slate-200); border-radius:10px;
  background:var(--slate-50); outline:none; font-size:1rem; transition:border-color 0.15s, background 0.15s;
}
.add-input:focus { border-color:var(--accent); background:var(--wit); }
.add-input::placeholder { color:var(--slate-400); }
.add-btn { width:46px; border-radius:10px; background:var(--accent-dark); color:var(--wit); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.add-btn:hover { background:var(--accent-hover); }
.add-btn svg { width:22px; height:22px; }
.hint { font-size:0.75rem; color:var(--slate-500); padding:0 1.125rem 0.75rem; margin-top:-0.375rem; }

/* Items */
.items { list-style:none; border-top:1px solid var(--slate-100); }
.item {
  display:grid; grid-template-columns:44px 1fr auto; align-items:center; min-height:52px;
  border-bottom:1px solid var(--slate-100); background:var(--wit); position:relative;
}
.item:last-child { border-bottom:0; }
.check { width:44px; height:52px; display:flex; align-items:center; justify-content:center; }
.box {
  width:22px; height:22px; border-radius:7px; border:2px solid var(--slate-300); display:flex; align-items:center; justify-content:center;
  transition:background 0.15s, border-color 0.15s, transform 0.15s;
}
.box svg { width:14px; height:14px; color:var(--wit); opacity:0; transform:scale(0.5); transition:opacity 0.15s, transform 0.2s cubic-bezier(.3,1.6,.6,1); }
.check:hover .box { border-color:var(--accent); }
.item.done .box { background:var(--accent); border-color:var(--accent); }
.item.done .box svg { opacity:1; transform:none; }
.check:active .box { transform:scale(0.88); }
.text {
  padding:0.75rem 0.25rem 0.75rem 0; font-size:1rem; color:var(--slate-800); word-break:break-word; outline:none; cursor:text; min-width:0;
}
.text:focus { color:var(--slate-900); }
.item.done .text { color:var(--slate-500); text-decoration:line-through; text-decoration-color:var(--slate-300); }
.item-actions { display:flex; align-items:center; padding-right:0.25rem; }
.del, .grip { width:36px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--slate-300); border-radius:8px; }
.del:hover { color:var(--rood); }
.grip { cursor:grab; touch-action:none; }
.grip:hover { color:var(--slate-500); }
.del svg, .grip svg { width:18px; height:18px; }
.item.dragging { box-shadow:0 8px 24px rgba(15,23,42,0.14); z-index:5; border-radius:10px; border-bottom-color:transparent; }
.item.placeholder-anim { transition:transform 0.15s ease; }
@media (hover:hover) { .item .del { opacity:0; } .item:hover .del, .item:focus-within .del { opacity:1; } }

.done-head {
  width:100%; display:flex; align-items:center; gap:0.5rem; padding:0.625rem 1.125rem; font-size:0.8125rem; font-weight:600;
  color:var(--slate-500); background:var(--slate-50); border-top:1px solid var(--slate-100); border-bottom:1px solid var(--slate-100);
  text-align:left;
}
.done-head svg { width:16px; height:16px; transition:transform 0.2s; }
.done-head.closed svg { transform:rotate(-90deg); }
.done-head .clear { margin-left:auto; font-weight:500; color:var(--slate-500); padding:0.125rem 0.375rem; border-radius:6px; }
.done-head .clear:hover { color:var(--rood); background:#fef2f2; }

.empty { padding:2rem 1.25rem 2.25rem; text-align:center; color:var(--slate-500); font-size:0.9375rem; }
.empty strong { display:block; color:var(--slate-600); font-weight:600; margin-bottom:0.25rem; }

/* Menu */
.menu-wrap { position:relative; }
.menu {
  position:absolute; right:0; top:42px; z-index:20; min-width:230px; background:var(--wit); border:1px solid var(--slate-200);
  border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,0.14); padding:0.375rem; display:none;
}
.menu.open { display:block; }
.menu button { width:100%; display:flex; align-items:center; gap:0.625rem; padding:0.5625rem 0.625rem; border-radius:8px; font-size:0.9375rem; text-align:left; color:var(--slate-700); }
.menu button:hover { background:var(--slate-100); }
.menu button svg { width:18px; height:18px; color:var(--slate-500); flex-shrink:0; }
.menu .sep { height:1px; background:var(--slate-100); margin:0.25rem 0.375rem; }
.menu .danger { color:var(--rood); }
.menu .danger svg { color:var(--rood); }
/* het menu mag buiten een korte kaart uitsteken */
.card:has(.menu.open) { overflow:visible; }

/* Gedeelde lijst */
.import {
  display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; padding:0.875rem 1rem; background:var(--wit);
  border:1.5px solid var(--accent-light); border-radius:12px; font-size:0.9375rem;
}
.import p { flex:1; color:var(--slate-600); }
.import strong { color:var(--slate-800); }
.btn { padding:0.5rem 0.875rem; border-radius:8px; font-weight:600; font-size:0.875rem; white-space:nowrap; }
.btn-primary { background:var(--accent-dark); color:var(--wit); }
.btn-ghost { color:var(--slate-500); }

/* Melding */
.toast {
  position:fixed; left:50%; bottom:calc(var(--bottom) + 1.25rem); transform:translate(-50%, calc(100% + 3rem)); visibility:hidden; z-index:50;
  background:var(--slate-800); color:var(--wit); border-radius:12px; padding:0.625rem 0.625rem 0.625rem 1rem;
  display:flex; align-items:center; gap:0.875rem; font-size:0.9375rem; box-shadow:0 10px 30px rgba(15,23,42,0.25);
  transition:transform 0.25s ease, visibility 0s 0.25s; max-width:calc(100% - 2rem);
}
.toast.show { transform:translate(-50%, 0); visibility:visible; transition:transform 0.25s ease; }
.toast button { color:#6ee7b7; font-weight:600; padding:0.25rem 0.5rem; border-radius:6px; }
.toast button:hover { background:rgba(255,255,255,0.08); }

.footer { text-align:center; padding:2rem 2rem calc(var(--bottom) + 2rem); border-top:1px solid var(--slate-200); background:var(--wit); }
.quote { font-size:0.8125rem; color:var(--accent-dark); }

@media (max-width:640px) {
  .back-link { position:static; margin-bottom:0.75rem; justify-content:center; display:flex; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

/* Toegankelijkheid (audit oktober 2026) */
:focus-visible { outline:2px solid #047857 !important; outline-offset:2px; }
.back-link { min-height:44px; min-width:44px; }
.icon-btn, #menu-btn { min-width:44px; min-height:44px; }
.tab { min-height:44px; }
.btn { min-height:44px; }
.list-name { min-height:44px; }
/* Voorbeeld */
.vb-bar { display:flex; flex-wrap:wrap; align-items:center; gap:0.5rem 0.75rem; margin:0 0 1rem; padding:0.5rem 0.5rem 0.5rem 0.75rem; background:#fffbeb; border:1px solid #fde68a; border-radius:12px; font-size:0.875rem; line-height:1.4; color:#78350f; }
.vb-bar svg { width:18px; height:18px; flex-shrink:0; color:#b45309; }
.vb-text { flex:1 1 14rem; min-width:0; display:flex; gap:0.5rem; align-items:flex-start; }
.vb-btns { display:flex; flex-wrap:wrap; gap:0.375rem; }
.vb-btn { min-height:44px; padding:0.375rem 0.625rem; border-radius:10px; font-size:0.875rem; font-weight:600; background:#fff; border:1px solid #e2e8f0; }
.vb-wis { color:#b91c1c; border-color:#fecaca; }
.vb-eigen { color:#047857; border-color:#a7f3d0; }
.vb-tag { font-size:0.6875rem; font-weight:600; padding:0 0.375rem; border-radius:999px; background:#fef3c7; color:#92400e; }
.tab.active .vb-tag { background:#fde68a; }
.ex-btn { margin-top:0.75rem; min-height:44px; padding:0 1rem; border-radius:10px; border:1.5px solid #a7f3d0; background:#fff; color:#047857; font-size:0.875rem; font-weight:600; }
.ex-btn:hover { background:#ecfdf5; }
/* Zichtbare download */
.export-row { display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem; }
.export-row .exp-btn { min-height:44px; display:inline-flex; align-items:center; gap:0.5rem; padding:0 0.875rem; border-radius:10px; background:#f1f5f9; color:#475569; font-size:0.875rem; font-weight:600; white-space:nowrap; }
.export-row .exp-btn:hover { background:#e2e8f0; color:#1e293b; }
.export-row .exp-btn svg { width:16px; height:16px; flex:none; }
.toast button { min-height:44px; }
.menu button { min-height:44px; }
.del, .grip { width:44px; }
.done-head .clear { display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; margin:-0.5rem 0; }
.ocw-row .ocw-yes { background:#dc2626; } .ocw-row .ocw-yes:hover { background:#b91c1c; }
.ocw-row button { min-height:44px; }
button.oc-import { color:#047857; min-height:44px; }

/* Opnieuw beginnen (zelfde knop in elke tool) */
.oc-restart-row { display:flex; justify-content:center; padding:0.5rem 0 0; }
.oc-restart-row[hidden] { display:none !important; }
.oc-restart { min-height:44px; padding:0.5rem 1rem; font:inherit; font-size:0.875rem; font-weight:500; color:#64748b; background:none; border:0; border-radius:10px; cursor:pointer; text-decoration:underline; text-decoration-color:#cbd5e1; text-underline-offset:3px; }
.oc-restart:hover { color:#b91c1c; background:#fef2f2; text-decoration-color:currentColor; }
</style>
</head>
<body>

<header class="header">
  <a href="https://onderconstructie.github.io/projectmanagement/" class="back-link" aria-label="Terug naar Projectmanagement">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Projectmanagement
  </a>
  <div class="logo">
    <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <circle cx="40" cy="40" r="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="22" y="22" width="12" height="12" rx="3.5" fill="#10b981"/>
      <path d="M25 28.2l2 2 4-4.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="39" y="26" width="20" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="22" y="40" width="12" height="12" rx="3.5" fill="#10b981"/>
      <path d="M25 46.2l2 2 4-4.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="39" y="44" width="16" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="23" y="59" width="10" height="10" rx="3" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="39" y="62" width="18" height="4" rx="2" fill="#e2e8f0"/>
    </svg>
  </div>
  <h1 class="title">Vinkje</h1>
  <p class="subtitle">Een lijstje om af te vinken en te hergebruiken</p>
</header>

<main class="main">
  <div class="import" id="import" hidden>
    <p>Gedeelde lijst: <strong id="import-name"></strong> (<span id="import-count"></span>)</p>
    <button class="btn btn-ghost" id="import-no">Negeer</button>
    <button class="btn btn-primary" id="import-yes">Bewaar</button>
  </div>

  <nav class="lists" id="lists" aria-label="Lijsten"></nav>
  <div class="vb-bar" id="vb-bar" hidden>
    <div class="vb-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Dit is een voorbeeld om de tool te verkennen. Het telt niet mee in andere tools.</span></div>
    <div class="vb-btns"><button type="button" class="vb-btn vb-wis" id="vb-wis">Wis voorbeeld</button><button type="button" class="vb-btn vb-eigen" id="vb-eigen">Maak er mijn eigen van</button></div>
  </div>

  <section class="card" id="card">
    <div class="card-head">
      <input class="list-name" id="list-name" aria-label="Naam van de lijst" maxlength="60" spellcheck="false">
      <button class="icon-btn icon-del" id="del-btn" type="button" aria-label="Verwijder lijst" title="Verwijder lijst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>
      <div class="menu-wrap">
        <button class="icon-btn" id="menu-btn" aria-label="Meer acties" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <div class="menu" id="menu" role="menu">
          <button data-act="reset" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Alles terug open</button>
          <button data-act="clear" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Afgevinkte wissen</button>
          <div class="sep"></div>
          <button data-act="share" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Deel als link</button>
          <button data-act="pdf" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3"/></svg>Als PDF</button>
          <button data-act="png" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Als afbeelding</button>
          <button data-act="copy" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Kopieer als tekst</button>
          <button data-act="duplicate" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 21h11a2 2 0 0 0 2-2V8"/></svg>Kopie als nieuwe lijst</button>
          <div class="sep"></div>
          <div class="sep"></div>
          <button data-act="wipe" class="danger" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>Alles wissen</button>
        </div>
      </div>
    </div>

    <div class="progress" id="progress">
      <div class="progress-text"><span id="progress-label"></span><strong id="progress-pct"></strong></div>
      <div class="bar"><span id="bar"></span></div>
    </div>

    <form class="add-row" id="add-form" autocomplete="off">
      <input class="add-input" id="add-input" placeholder="Nieuw item, of plak een hele lijst" aria-label="Nieuw item" enterkeyhint="done">
      <button class="add-btn" type="submit" aria-label="Toevoegen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
    <div class="oc-import-row" style="padding:0 0.75rem 0.75rem;margin-top:-0.25rem"><button type="button" class="oc-import" data-oc-types="taak,actie" id="oc-imp" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Overnemen uit…</button></div>

    <ul class="items" id="open-items"></ul>
    <div class="empty" id="empty" hidden></div>
    <button class="done-head" id="done-head" hidden aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <span id="done-label"></span>
      <span class="clear" id="done-clear" role="button" tabindex="0" aria-label="Afgevinkte items wissen">wis</span>
    </button>
    <ul class="items" id="done-items"></ul>
  </section>
  <div class="export-row" id="export-row" hidden>
    <button type="button" class="exp-btn" data-exp="png" title="Download als afbeelding"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Afbeelding</button>
    <button type="button" class="exp-btn" data-exp="pdf" title="Download als PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13h6M9 17h4"/></svg>PDF</button>
  </div>

<div class="oc-restart-row" id="oc-restart-row" hidden><button type="button" class="oc-restart" id="oc-restart-btn">Opnieuw beginnen</button></div>
</main>

<footer class="footer">
  <p class="quote">Klein afvinken is ook vooruitgaan.</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-btn" hidden>Ongedaan</button></div>

<script>
/* ---------- Overnemen tussen tools (gedeeld door de Onder Constructie-tools, v2) ----------
   Alle tools draaien op hetzelfde domein en delen dus localStorage. Elke tool legt wat hij te bieden
   heeft klaar onder 'oc.share.<tool-id>', in een vaste vorm, zodat andere tools het kunnen overnemen
   zonder elkaars binnenkant te kennen.

   Soorten (type):
     'betrokkene'  persoon, rol, stakeholder, doelgroep of team   { text, note? }
     'taak'        iets dat gedaan moet worden                     { text, note? }
     'actie'       taak met eigenaar en/of termijn                 { text, who?, when? }
     'risico'      risico met kans en impact                       { text, note? }

   Gebruik:
     ocShare.publish('raci', 'RACI-matrix', [
       { name:'Heraanleg stadspark', items:[ { type:'betrokkene', text:'Projectleider' }, { type:'taak', text:'Budget goedkeuren' } ] }
     ]);                                   // aanroepen na elke bewaring
     ocShare.clear('raci');                // bij "Alles wissen"
     const gekozen = await ocShare.pick({ types:['betrokkene'], self:'weerstand', title:'Doelgroepen overnemen' });
     // geeft [] terug bij annuleren, anders de aangevinkte items (met .source en .list erbij)
*/
const ocShare = (() => {
  const PREFIX = 'oc.share.';
  const LABEL = { betrokkene:'betrokkenen', taak:'taken', actie:'acties', risico:"risico's" };
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  function publish(id, tool, lists) {
    try {
      const clean = (lists || []).map(l => ({
        name: String(l.name || '').slice(0, 80),
        items: (l.items || []).filter(i => i && i.type && String(i.text || '').trim())
          .slice(0, 300).map(i => ({ type:i.type, text:String(i.text).trim().slice(0, 300),
            note: i.note ? String(i.note).slice(0, 200) : undefined, who: i.who || undefined, when: i.when || undefined }))
      })).filter(l => l.items.length);
      if (!clean.length) { localStorage.removeItem(PREFIX + id); return; }
      localStorage.setItem(PREFIX + id, JSON.stringify({ id, tool, updated: Date.now(), lists: clean }));
    } catch {}
  }
  function clear(id) { try { localStorage.removeItem(PREFIX + id); } catch {} }

  // Elke bron apart: één kapotte sleutel mag de andere niet verbergen.
  function sources(types, self) {
    const out = [];
    let keys = [];
    try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch { return out; }
    keys.forEach(k => {
      if (!k || !k.startsWith(PREFIX) || k === PREFIX + self) return;
      try {
        const d = JSON.parse(localStorage.getItem(k));
        if (!d || !Array.isArray(d.lists)) return;
        d.lists.forEach(l => {
          if (!l || !Array.isArray(l.items)) return;
          const items = l.items.filter(it => it && types.includes(it.type) && typeof it.text === 'string');
          if (items.length) out.push({ tool: String(d.tool || d.id || k.slice(PREFIX.length)), id: d.id, updated: +d.updated || 0, list: String(l.name || ''), items });
        });
      } catch {}
    });
    return out.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  }

  let styled = false;
  function style() {
    if (styled) return; styled = true;
    const s = document.createElement('style');
    s.textContent = `
      .ocs-back{position:fixed;inset:0;z-index:10000;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45);
        backdrop-filter:blur(3px);opacity:0;transition:opacity .15s;font-family:'DM Sans',system-ui,sans-serif}
      @media(min-width:640px){.ocs-back{align-items:center;padding:1rem}}
      .ocs-back.open{opacity:1}
      .ocs{width:100%;max-width:520px;max-height:min(86vh,720px);display:flex;flex-direction:column;background:#fff;border-radius:18px 18px 0 0;
        box-shadow:0 20px 50px rgba(15,23,42,.25);transform:translateY(12px);transition:transform .15s;color:#1e293b}
      @media(min-width:640px){.ocs{border-radius:18px}}
      .ocs-back.open .ocs{transform:none}
      .ocs-head{padding:1.125rem 1.25rem .75rem;border-bottom:1px solid #e2e8f0}
      .ocs-title{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
      .ocs-sub{font-size:.8125rem;color:#64748b;margin-top:.125rem}
      .ocs-body{overflow:auto;padding:.5rem 1.25rem 1rem;flex:1}
      .ocs-src{margin-top:.875rem}
      .ocs-src-head{display:flex;align-items:center;gap:.5rem;padding:.375rem 0}
      .ocs-src-head b{font-size:.9375rem}
      .ocs-src-head span{font-size:.75rem;color:#64748b}
      .ocs-all{margin-left:auto;font:inherit;font-size:.8125rem;color:#047857;background:none;border:0;cursor:pointer;padding:.25rem .5rem;min-height:44px;border-radius:6px}
      .ocs-all:hover{background:#d1fae5}
      .ocs-item{display:flex;align-items:flex-start;gap:.625rem;padding:.625rem .25rem;min-height:44px;box-sizing:border-box;border-top:1px solid #f1f5f9;cursor:pointer;font-size:.9375rem;line-height:1.4}
      .ocs-item input{width:18px;height:18px;margin-top:.125rem;accent-color:#10b981;flex:none}
      .ocs-item small{display:block;font-size:.75rem;color:#64748b}
      .ocs-empty{padding:1.5rem .25rem;color:#64748b;font-size:.9375rem;line-height:1.5}
      .ocs-foot{display:flex;gap:.5rem;justify-content:flex-end;padding:.875rem 1.25rem calc(.875rem + env(safe-area-inset-bottom,0px));border-top:1px solid #e2e8f0}
      .ocs-btn{font:inherit;font-size:.9375rem;font-weight:600;padding:.625rem 1rem;min-height:44px;border-radius:10px;border:0;cursor:pointer}
      .ocs-cancel{background:#f1f5f9;color:#475569}
      .ocs-ok{background:#047857;color:#fff}.ocs-ok:hover{background:#065f46}
      .ocs-ok:disabled{background:#cbd5e1;color:#334155;cursor:default}
      .ocs-back :focus-visible{outline:2px solid #047857;outline-offset:2px}`;
    document.head.appendChild(s);
  }

  function pick({ types, self, title, intro }) {
    style();
    return new Promise(resolve => {
      const src = sources(types, self);
      const back = document.createElement('div');
      back.className = 'ocs-back';
      const what = types.map(t => LABEL[t] || t).join(' of ');
      back.innerHTML = `<div class="ocs" role="dialog" aria-modal="true" aria-label="${esc(title || 'Overnemen')}">
        <div class="ocs-head"><div class="ocs-title">${esc(title || 'Overnemen uit een andere tool')}</div>
          <div class="ocs-sub">${esc(intro || `Kies welke ${what} je wil overnemen.`)}</div></div>
        <div class="ocs-body">${src.length ? src.map((s, si) => `
          <div class="ocs-src"><div class="ocs-src-head"><b>${esc(s.tool)}</b><span>${esc(s.list)} · ${s.items.length}</span>
            <button class="ocs-all" type="button" data-all="${si}">alles</button></div>
            ${s.items.map((it, ii) => `<label class="ocs-item"><input type="checkbox" data-s="${si}" data-i="${ii}">
              <span>${esc(it.text)}${it.who || it.when || it.note ? `<small>${esc([it.who, it.when, it.note].filter(Boolean).join(' · '))}</small>` : ''}</span></label>`).join('')}
          </div>`).join('') : `<p class="ocs-empty">Er zijn nog geen ${esc(what)} om over te nemen. Vul ze eerst in een andere tool van Onder Constructie in, dan verschijnen ze hier.</p>`}
        </div>
        <div class="ocs-foot"><button class="ocs-btn ocs-cancel" type="button">Annuleer</button>
          <button class="ocs-btn ocs-ok" type="button" disabled>Neem over</button></div></div>`;
      document.body.appendChild(back);
      requestAnimationFrame(() => back.classList.add('open'));
      const ok = back.querySelector('.ocs-ok');
      const boxes = () => [...back.querySelectorAll('input[type=checkbox]')];
      const sync = () => { const n = boxes().filter(b => b.checked).length; ok.disabled = !n; ok.textContent = n ? `Neem ${n} over` : 'Neem over'; };
      back.addEventListener('change', sync);
      back.addEventListener('click', e => {
        const a = e.target.closest('[data-all]');
        if (a) { const bs = boxes().filter(b => b.dataset.s === a.dataset.all); const all = bs.every(b => b.checked); bs.forEach(b => b.checked = !all); sync(); }
        if (e.target === back) close([]);
      });
      function close(v) { document.removeEventListener('keydown', onKey, true); back.remove(); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close([]); } }
      document.addEventListener('keydown', onKey, true);
      back.querySelector('.ocs-cancel').addEventListener('click', () => close([]));
      ok.addEventListener('click', () => close(boxes().filter(b => b.checked).map(b => {
        const s = src[+b.dataset.s]; return { ...s.items[+b.dataset.i], source: s.tool, list: s.list };
      })));
      const first = back.querySelector('input,.ocs-cancel'); first && first.focus();
    });
  }

  // Hoeveel er klaarligt voor deze soorten (om een knop te tonen of een teller te zetten).
  const count = (types, self) => sources(types, self).reduce((n, s) => n + s.items.length, 0);
  return { publish, clear, pick, count, sources, esc };
})();

/* ---------- Alles wissen, klaarleggen en overnemen ---------- */
const OC_ID = 'vinkje', OC_TOOL = 'Vinkje';
let ocSaves = 0, ocPubT = null;
// Wordt bij elke bewaring aangeroepen: telt (voor 'Ongedaan') en legt na een korte pauze klaar voor andere tools.
function ocAfterSave() { ocSaves++; clearTimeout(ocPubT); ocPubT = setTimeout(() => { try { ocPublish(); } catch {} ocRefreshImports(); }, 300); }
function ocRefreshImports() {
  document.querySelectorAll('[data-oc-types]').forEach(b => { b.hidden = !ocShare.count(b.dataset.ocTypes.split(','), OC_ID); });
}
['focus', 'storage'].forEach(ev => window.addEventListener(ev, () => setTimeout(ocRefreshImports, 50)));
document.addEventListener('visibilitychange', () => { if (!document.hidden) ocRefreshImports(); });
setTimeout(() => { try { ocPublish(); } catch {} ocRefreshImports(); }, 0);
// Bevestiging in de pagina (geen pop-up van de browser).
// Stijl van de bevestiging en de knoppen 'Overnemen uit…': meteen laden.
function ocStyle() {
  if (!document.getElementById('ocw-style')) {
    const s = document.createElement('style'); s.id = 'ocw-style';
    s.textContent = `.ocw-back{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);font-family:'DM Sans',system-ui,sans-serif}
      .ocw{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:1.375rem 1.375rem 1.125rem;box-shadow:0 20px 50px rgba(15,23,42,.25);color:#1e293b}
      .ocw b{display:block;font-size:1.0625rem;letter-spacing:-.01em;margin-bottom:.375rem}
      .ocw p{font-size:.9375rem;line-height:1.5;color:#475569}
      .ocw-row{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem}
      .ocw-row button{font:inherit;font-size:.9375rem;font-weight:600;padding:.625rem 1rem;border-radius:10px;border:0;cursor:pointer}
      .ocw-no{background:#f1f5f9;color:#475569} .ocw-yes{background:#ef4444;color:#fff} .ocw-yes:hover{background:#dc2626}
      .oc-import{display:inline-flex;align-items:center;gap:.375rem;font:inherit;font-size:.8125rem;font-weight:600;color:#059669;background:#fff;border:1px dashed #a7f3d0;border-radius:999px;padding:.3125rem .75rem;cursor:pointer;white-space:nowrap}
      .oc-import:hover{background:#ecfdf5;border-color:#10b981} .oc-import svg{width:15px;height:15px} .oc-import[hidden]{display:none}`;
    document.head.appendChild(s);
  }
}
ocStyle();
function ocConfirm(title, text, okText) {
  return new Promise(resolve => {
    const back = document.createElement('div'); back.className = 'ocw-back';
    back.innerHTML = '<div class="ocw" role="alertdialog" aria-modal="true"><b></b><p></p><div class="ocw-row"><button class="ocw-no" type="button">Annuleer</button><button class="ocw-yes" type="button"></button></div></div>';
    back.querySelector('b').textContent = title; back.querySelector('p').textContent = text; back.querySelector('.ocw-yes').textContent = okText;
    document.body.appendChild(back);
    const done = v => { document.removeEventListener('keydown', key, true); back.remove(); resolve(v); };
    const key = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', key, true);
    back.querySelector('.ocw-no').onclick = () => done(false);
    back.querySelector('.ocw-yes').onclick = () => done(true);
    back.addEventListener('click', e => { if (e.target === back) done(false); });
    back.querySelector('.ocw-no').focus();
  });
}
// Ongedaan maken van een wisbeurt kan alleen zolang er sindsdien niets anders bewaard werd.
function ocUndoable(restore) {
  const mark = ocSaves;
  return () => {
    if (ocSaves !== mark) { setTimeout(() => toast('Ongedaan maken kan niet meer: er is intussen iets veranderd'), 60); return; }
    restore();
  };
}

function ocPublish() {
  ocShare.publish(OC_ID, OC_TOOL, state.lists.filter(l => !l.voorbeeld).map(l => ({ name:l.name, items:l.items.filter(i => !i.done).map(i => ({ type:'taak', text:i.text })) })));
}

async function ocWipeAll() {
  if (!await ocConfirm(`Alles wissen in ${OC_TOOL}?`, 'Alle lijsten verdwijnen. Je kan dit nog ongedaan maken tot je iets anders doet.', 'Alles wissen')) return;
  const copy = JSON.parse(JSON.stringify(state));
  try { localStorage.removeItem(KEY); } catch {}
  state = load(); save(); render();
  ocShare.clear(OC_ID);
  toast('Alles gewist', ocUndoable(() => { state = copy; }));
}
document.addEventListener('click', e => { if (e.target.closest('[data-act="wipe"]')) ocWipeAll(); });

document.addEventListener('click', async e => {
  if (!e.target.closest('#oc-imp')) return;
  const picked = await ocShare.pick({ types:['taak','actie'], self:OC_ID, title:'Overnemen in je checklist', intro:'Kies taken of acties uit andere tools. Ze komen onderaan je lijst.' });
  if (!picked.length) return;
  const l = cur(), have = new Set(l.items.map(i => i.text.toLowerCase())), restore = snapshot();
  let n = 0;
  picked.forEach(p => {
    const extra = [p.who, p.when].filter(Boolean).join(', ');
    const text = (p.text + (extra ? ` (${extra})` : '')).slice(0, 500);
    if (have.has(text.toLowerCase())) return; have.add(text.toLowerCase());
    l.items.push({ id:uid(), text, done:false }); n++;
  });
  save(); render();
  toast(n ? `${n} ${n === 1 ? 'item' : 'items'} overgenomen` : 'Alles stond al in je lijst', n ? restore : undefined);
});

/* ---------- Download als afbeelding of PDF (gedeeld door de Onder Constructie-tools, v2) ----------
   Gebruik:
     ocExport.png(bouwFn, 'bestandsnaam', { landscape:true })
     ocExport.pdf(bouwFn, 'bestandsnaam', { landscape:true })
   bouwFn() geeft { node, title, subtitle } terug: een DOM-knoop met inline styles, zonder knoppen of invoervelden.
   Die komt buiten beeld op een witte pagina met kop (titel, ondertitel, datum) en voet.
   Zet data-oc-keep op blokken die in een PDF niet over twee pagina's gesplitst mogen worden
   (een beslissing, een kaartje, een rij); ze schuiven dan door naar de volgende pagina.
   html2canvas en jsPDF worden pas geladen bij de eerste download, van dezelfde adressen als de
   andere tools, zodat de app ze offline kan bewaren. */
const ocExport = (() => {
  const LIBS = {
    h2c: '/lib/html2canvas-1.4.1.min.js',
    pdf: '/lib/jspdf-2.5.1.umd.min.js'
  };
  const A4 = { w: 210, h: 297 }, MARGIN = 10;   // mm
  const loaded = {};
  function load(url) {
    if (!loaded[url]) loaded[url] = new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = url; s.onload = ok; s.onerror = () => { delete loaded[url]; fail(new Error('laden mislukt')); };
      document.head.appendChild(s);
    });
    return loaded[url];
  }
  const today = () => new Date().toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' });
  function page(content, { title, subtitle, width }) {
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:fixed;left:-20000px;top:0;width:${width}px;background:#fff;padding:36px 40px 28px;
      font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:#1e293b;-webkit-font-smoothing:antialiased;box-sizing:border-box;`;
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid #10b981;padding-bottom:12px;margin-bottom:20px;';
    head.innerHTML = `<div><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#1e293b"></div>
      <div style="font-size:14px;color:#64748b;margin-top:2px"></div></div>
      <div style="font-size:12px;color:#94a3b8;white-space:nowrap">${today()}</div>`;
    head.children[0].children[0].textContent = title || '';
    head.children[0].children[1].textContent = subtitle || '';
    const foot = document.createElement('div');
    foot.style.cssText = 'margin-top:22px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;';
    foot.innerHTML = '<span>Onder Constructie</span><span>onderconstructie.github.io</span>';
    wrap.append(head, content, foot);
    document.body.appendChild(wrap);
    return wrap;
  }
  // Schuift blokken met data-oc-keep die over een paginagrens zouden vallen naar de volgende pagina.
  function keepTogether(wrap, pageH) {
    const top0 = () => wrap.getBoundingClientRect().top;
    for (const el of wrap.querySelectorAll('[data-oc-keep]')) {
      const r = el.getBoundingClientRect(), t = r.top - top0(), b = t + r.height;
      if (r.height > pageH * 0.85) continue;            // te groot om heel te houden
      const boundary = Math.ceil(t / pageH) * pageH;     // eerstvolgende grens na de bovenkant
      if (t % pageH !== 0 && b > boundary && t < boundary) {
        const gap = document.createElement('div');
        gap.style.cssText = `height:${boundary - t + 6}px;`;
        el.parentNode.insertBefore(gap, el);
      }
    }
  }
  async function canvasOf(build, opts) {
    await load(LIBS.h2c);
    const built = build();
    const node = page(built.node, { title: built.title, subtitle: built.subtitle, width: opts.width });
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      if (opts.pageH) keepTogether(node, opts.pageH);
      return await window.html2canvas(node, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
    } finally { node.remove(); }
  }
  function save(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  const widthFor = opts => opts.width || (opts.landscape ? 1120 : 800);
  async function png(build, name, opts = {}) {
    const c = await canvasOf(build, { width: widthFor(opts) });
    await new Promise(ok => c.toBlob(b => { save(b, name + '.png'); ok(); }, 'image/png'));
  }
  async function pdf(build, name, opts = {}) {
    const landscape = !!opts.landscape, width = widthFor(opts);

// Haalt opsommingstekens, nummering en markdown-vakjes weg; "[x]" wordt meteen afgevinkt.
function parseLines(text) {
  return text.split(/\r?\n/).map(line => {
    let t = line.trim(), done = false;
    if (!t) return null;
    t = t.replace(/^([-*+•·▪◦–]|\d+[.)]|[a-z][.)])\s+/i, '');
    const m = t.match(/^\[( |x|X|✓)\]\s*/);
    if (m) { done = m[1] !== ' '; t = t.slice(m[0].length); }
    t = t.replace(/^[☐☑✓✔]\s*/, s => { if (/[☑✓✔]/.test(s)) done = true; return ''; }).trim();
    return t ? { id:uid(), text:t.slice(0, 500), done } : null;
  }).filter(Boolean);
}

let drag = null;

  e.preventDefault();
  const li = grip.closest('.item'), list = li.parentElement;
  const rows = [...list.children], rect = li.getBoundingClientRect();
  drag = { li, list, rows, startY:e.clientY, h:rect.height, from:rows.indexOf(li), to:rows.indexOf(li), pid:e.pointerId };

  drag.li.style.transform = `translateY(${dy}px)`;
  const to = Math.max(0, Math.min(drag.rows.length - 1, drag.from + Math.round(dy / drag.h)));
  drag.to = to;
  drag.rows.forEach((r, i) => {
    if (r === drag.li) return;
    let shift = 0;
    if (drag.from < to && i > drag.from && i <= to) shift = -drag.h;
    if (drag.from > to && i < drag.from && i >= to) shift = drag.h;
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const { from, to, rows } = drag;
  rows.forEach(r => { r.style.transform = ''; r.classList.remove('placeholder-anim', 'dragging'); });
  if (from !== to) {
    const l = cur();
    const open = l.items.filter(i => !i.done), done = l.items.filter(i => i.done);

function ocProject(fb) { try { const p = JSON.parse(localStorage.getItem('oc.project')); return p && typeof p.name === 'string' && p.name.trim() ? p.name.trim().slice(0, 80) : fb; } catch { return fb; } }
/* Bestandsnaam: tool-project-datum (JJJJ-MM-DD), zonder dubbele datum of dubbele toolnaam */
function ocFileName(tool, project) {
  const d = new Date(), iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const slug = s => String(s || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const t = slug(tool);
  let p = slug(project).replace(/(^|-)\d{1,4}-\d{1,2}-\d{1,4}(?=-|$)/g, '').replace(/^-+|-+$/g, '');
  if (p === t) p = ''; else if (p.startsWith(t + '-')) p = p.slice(t.length + 1);
  p = p.slice(0, 50).replace(/-+$/, '');
  return [t, p, iso].filter(Boolean).join('-');
}

/* ---------- Delen via link: de lijst zit in de URL, er gaat niets naar een server ---------- */
function encode(l) {
  const data = JSON.stringify({ n:l.name, i:l.items.map(i => i.done ? [i.text, 1] : [i.text]) });
  const bytes = new TextEncoder().encode(data);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));

}
function decode(s) {

    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (!d || !Array.isArray(d.i)) return null;
    return { name:String(d.n || 'Gedeelde lijst').slice(0, 60),
             items:d.i.slice(0, 500).map(x => ({ id:uid(), text:String(x[0] || '').slice(0, 500), done:!!x[1] })).filter(x => x.text) };
  } catch { return null; }
}

  const url = 'https://onderconstructie.github.io/vinkje/#l=' + encode(l);
  if (navigator.share && matchMedia('(pointer:coarse)').matches) {
    try { await navigator.share({ title:l.name, text:`Checklist: ${l.name}`, url }); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  await copy(url) ? toast('Link gekopieerd') : toast('Kopiëren lukt hier niet');
}
let pending = null;
function checkImport() {
  const m = location.hash.match(/^#l=([A-Za-z0-9_-]+)/);
  if (!m) return;
  pending = decode(m[1]);
  history.replaceState(null, '', location.pathname + location.search);
  if (!pending || !pending.items.length) { pending = null; return; }
  $('import-name').textContent = pending.name;
  $('import-count').textContent = pending.items.length + (pending.items.length === 1 ? ' item' : ' items');
  $('import').hidden = false;
}
$('import-yes').addEventListener('click', () => {
  if (pending) newList(pending.name, pending.items);
  pending = null; $('import').hidden = true; toast('Lijst bewaard');
});
$('import-no').addEventListener('click', () => { pending = null; $('import').hidden = true; });

/* ---------- Andere tabbladen houden we gelijk ---------- */
window.addEventListener('storage', e => { if (e.key === KEY) { state = load(); render(); } });

checkImport();
render();
</script>
<script>
/* Opnieuw beginnen: zichtbaar zodra er echt iets ingevuld is; start de eigen 'Alles wissen' van de tool.
   'Leeg' = wat de tool zelf bewaart zonder inbreng van de gebruiker (na een eerste bezoek of na wissen). */
(() => {
  const meta = document.querySelector('meta[name="oc:opslag"]');
  const keys = meta ? meta.content.split(',').map(s => s.trim()).filter(k => k && !k.startsWith('oc.share.') && !k.endsWith('*')) : [];
  const BASE = 'oc.leeg.' + location.pathname;   // niet onder oc-app.*: dat wist het gegevensscherm apart
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const vals = () => Object.fromEntries(keys.map(k => [k, get(k)]));
  const has = v => Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.values(v).some(has) : typeof v === 'string' && v.trim().length > 0;
  const content = raw => { try { return has(JSON.parse(raw)); } catch { return !!raw; } };
  let base = null; try { base = JSON.parse(get(BASE) || 'null'); } catch {}
  const setBase = () => { base = vals(); try { localStorage.setItem(BASE, JSON.stringify(base)); } catch {} sync(); };
  const filled = () => { const v = vals(); return keys.some(k => v[k] != null && content(v[k]) && !(base && v[k] === base[k])); };
  const row = document.getElementById('oc-restart-row');
  function sync() { row.hidden = !filled() || !document.querySelector('[data-act="wipe"]'); }
  let t; const later = () => { clearTimeout(t); t = setTimeout(sync, 350); };
  ['click', 'input', 'change', 'keyup'].forEach(ev => document.addEventListener(ev, later, true));
  window.addEventListener('storage', later); window.addEventListener('focus', later);
  // Eerste bezoek: wat de tool zelf meteen bewaart, telt als leeg. Een tool die nog niets klaarlegde
  // voor andere tools (oc.share.*), heeft nog geen echte inhoud.
  const share = meta ? meta.content.split(',').map(s => s.trim()).find(k => k.startsWith('oc.share.')) : null;
  if (!base && share && get(share) == null) setBase();
  else if (keys.every(k => get(k) == null)) setTimeout(setBase, 900);
  // Na wissen (via deze knop of het menu): de nieuwe toestand is de lege toestand.
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-act="wipe"]')) return;
    const before = JSON.stringify(vals()); let n = 0;
    const iv = setInterval(() => {
      if (++n > 40) return clearInterval(iv);
      if (document.querySelector('.ocw-back')) return;               // bevestiging staat nog open
      if (JSON.stringify(vals()) !== before) { clearInterval(iv); setTimeout(setBase, 400); }
      else if (n > 5) clearInterval(iv);                              // geannuleerd
    }, 150);
  }, true);
  document.getElementById('oc-restart-btn').addEventListener('click', () => { const w = document.querySelector('[data-act="wipe"]'); w && w.click(); });
  sync();
})();
</script>
