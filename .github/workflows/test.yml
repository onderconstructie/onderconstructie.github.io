name: Tools testen

# Bij elke wijziging: de tools in deze repo. Elke nacht en met de hand: de hele live site,
# ook de tools uit de andere repo's. Een fout geeft een rode markering en een mail van GitHub.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser installeren
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Tools in deze repo testen
        if: github.event_name == 'push'
        run: python3 scripts/test-tools.py
      - name: Hele live site testen
        if: github.event_name != 'push'
        run: python3 scripts/test-tools.py --live
