name: tools.json bijwerken

# Leest de metatags (oc:groep, oc:labels, oc:kort, ...) uit elke tool op de live site
# en bouwt daarmee tools.json voor de app. Elke nacht, en met de hand via "Run workflow".
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/bouw-tools.py'

permissions:
  contents: write

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tools.json bouwen
        run: python3 scripts/bouw-tools.py
      - name: Bewaren als er iets veranderd is
        run: |
          if git diff --quiet -- tools.json; then
            echo "tools.json is ongewijzigd"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add tools.json
            git commit -m "tools.json bijgewerkt uit de metatags van de tools"
            git push
          fi
